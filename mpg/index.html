<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiplayed Golf</title>

    <script>
        (function () {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
                || (navigator.maxTouchPoints > 1 && window.innerWidth <= 820);
            if (isMobile) {
                window.location.replace("app.html");
            }
        })();
    </script>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Three.js + Addons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- GSAP for Smooth Kinematics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        :root {
            --accent-gold: #d4af37;
            --accent-green: #10b981;
            --text-primary: #ffffff;
            --text-muted: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #05140d;
            color: var(--text-primary);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        /* Minimal Clean UI Overlay */
        .overlay-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.2rem 3.5rem;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1.1rem;
            text-decoration: none;
            color: #fff;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4), inset 0 0 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s ease;
        }

        .brand:hover .brand-logo {
            transform: scale(1.08) rotate(6deg);
        }

        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 1.5rem;
            background: rgba(5, 20, 13, 0.75);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 9999px;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-decoration: none;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .cta-button:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.35);
        }

        /* User Profile Pill & Dropdown */
        .user-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 0.9rem 0.45rem 0.55rem;
            background: rgba(4, 18, 12, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 9999px;
            backdrop-filter: blur(20px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .user-pill:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d4af37, #f7d070);
            color: #041209;
            font-weight: 800;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .user-details {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .user-name {
            font-size: 0.82rem;
            font-weight: 700;
            color: #fff;
        }

        .user-points {
            font-size: 0.7rem;
            font-weight: 600;
            color: #d4af37;
        }

        .auth-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: rgba(5, 20, 13, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 14px;
            padding: 0.5rem;
            min-width: 160px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(25px);
            display: none;
            flex-direction: column;
            gap: 0.25rem;
            z-index: 100;
        }

        .auth-dropdown.show {
            display: flex;
        }

        .auth-dropdown-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.55rem 0.8rem;
            color: #cbd5e1;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            background: transparent;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: all 0.2s ease;
        }

        .auth-dropdown-item:hover {
            background: rgba(212, 175, 55, 0.15);
            color: #fff;
        }

        /* Auth Modal Overlay & Box */
        .auth-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 8, 5, 0.75);
            backdrop-filter: blur(12px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .auth-modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .auth-modal-card {
            background: linear-gradient(160deg, rgba(8, 28, 18, 0.95) 0%, rgba(4, 15, 10, 0.98) 100%);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(212, 175, 55, 0.12);
            padding: 2.2rem;
            width: 100%;
            max-width: 420px;
            position: relative;
            color: #fff;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .auth-modal-overlay.active .auth-modal-card {
            transform: scale(1);
        }

        .auth-modal-close {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #94a3b8;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .auth-modal-close:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .auth-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 9999px;
            padding: 0.3rem;
            margin-bottom: 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .auth-tab-btn {
            flex: 1;
            padding: 0.6rem;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .auth-tab-btn.active {
            background: linear-gradient(135deg, #d4af37, #f7d070);
            color: #041209;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .auth-form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .auth-form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #cbd5e1;
            margin-bottom: 0.45rem;
        }

        .auth-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .auth-input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
        }

        .auth-submit-btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #d4af37 0%, #f7d070 100%);
            border: none;
            border-radius: 12px;
            color: #041209;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 0.6rem;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
            transition: all 0.25s ease;
        }

        .auth-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.6);
        }

        .auth-submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .auth-alert {
            padding: 0.65rem 0.9rem;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            display: none;
        }

        .auth-alert.error {
            display: block;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .auth-alert.success {
            display: block;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
        }

        /* Active Club Hero Typography */
        .club-hero-display {
            position: absolute;
            left: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            max-width: 480px;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .club-hero-display.visible {
            opacity: 1;
            transform: translateY(-50%);
        }

        .club-hero-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.4rem;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 0.9rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .club-hero-desc {
            font-size: 1rem;
            line-height: 1.65;
            color: var(--text-muted);
            margin-bottom: 2rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .club-enter-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.95rem 2.2rem;
            background: linear-gradient(135deg, #d4af37 0%, #f7d070 100%);
            border-radius: 9999px;
            color: #041209;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            box-shadow: 0 12px 35px rgba(212, 175, 55, 0.45);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .club-enter-btn:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 18px 45px rgba(212, 175, 55, 0.65);
            background: linear-gradient(135deg, #f7d070, #ffffff);
        }

        .club-enter-btn svg {
            transition: transform 0.3s ease;
        }

        .club-enter-btn:hover svg {
            transform: translateX(5px);
        }

        .club-enter-btn.disabled {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.4);
            box-shadow: none;
            cursor: not-allowed;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .club-enter-btn.disabled:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: none;
        }

        .club-enter-btn.disabled svg {
            opacity: 0.4;
            transform: none !important;
        }

        /* Bottom Minimalist Club Navigation Pill */
        .bottom-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .club-selector-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 0.6rem;
            background: rgba(4, 18, 12, 0.72);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
        }

        .club-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 0.65rem 1.35rem;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .club-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .club-btn.active {
            color: #041209;
            background: linear-gradient(135deg, #d4af37, #f7d070);
            box-shadow: 0 4px 22px rgba(212, 175, 55, 0.5);
        }

        .hint-text {
            position: absolute;
            bottom: 6.8rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .overlay-layer {
                padding: 1.5rem;
            }

            .club-hero-display {
                left: 1.5rem;
                right: 1.5rem;
                top: auto;
                bottom: 8.5rem;
                transform: none;
                max-width: none;
                background: rgba(4, 18, 12, 0.88);
                padding: 1.5rem;
                border-radius: 1.5rem;
                backdrop-filter: blur(24px);
                border: 1px solid rgba(255, 255, 255, 0.15);
            }

            .club-hero-title {
                font-size: 2.2rem;
            }

            .club-btn {
                padding: 0.5rem 0.8rem;
                font-size: 0.78rem;
            }

            .hint-text {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="overlay-layer">

        <!-- Header -->
        <header class="interactive">
            <a href="javascript:void(0)" class="brand">
                <img src="logo.jpeg" alt="Multiplayed Golf" class="brand-logo" onerror="this.src='../icon.jpg'">
                <div>
                    <div class="brand-title">Multiplayed Golf</div>
                </div>
            </a>

            <div class="header-actions">
                <!-- User Profile / Login Trigger -->
                <div id="auth-nav-container">
                    <button id="header-login-btn" class="cta-button" onclick="openAuthModal('login')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span>Sign In</span>
                    </button>

                    <div id="header-user-badge" class="user-pill" style="display: none;"
                        onclick="toggleUserDropdown(event)">
                        <div class="user-avatar" id="header-user-avatar">U</div>
                        <div class="user-details">
                            <span class="user-name" id="header-user-name">Golfer</span>
                            <span class="user-points" id="header-user-points">0 PTS</span>
                        </div>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2.5">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>

                        <div id="header-user-dropdown" class="auth-dropdown">
                            <a href="app.html" class="auth-dropdown-item">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                    <line x1="8" y1="21" x2="16" y2="21"></line>
                                    <line x1="12" y1="17" x2="12" y2="21"></line>
                                </svg>
                                <span>Open App</span>
                            </a>
                            <button class="auth-dropdown-item" onclick="handleLogout(event)" style="color: #f87171;">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                    <polyline points="16 17 21 12 16 7"></polyline>
                                    <line x1="21" y1="12" x2="9" y2="12"></line>
                                </svg>
                                <span>Sign Out</span>
                            </button>
                        </div>
                    </div>
                </div>

                <a href="app.html" class="cta-button">
                    <span>Launch App</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="7" y1="17" x2="17" y2="7"></line>
                        <polyline points="7 7 17 7 17 17"></polyline>
                    </svg>
                </a>
            </div>
        </header>

        <!-- Active Club Hero Typography -->
        <div id="hero-display" class="club-hero-display interactive visible">
            <h1 id="hero-title" class="club-hero-title">Mobile App</h1>
            <p id="hero-desc" class="club-hero-desc">
                Description
            </p>
            <a id="hero-link" href="app.html" class="club-enter-btn">
                <span>Explore Mobile App</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>
        </div>

        <div class="hint-text">Drag to rotate · Click club or use Arrow Keys (← →) / 1-5</div>

        <!-- Bottom Club Selector -->
        <div class="bottom-nav interactive">
            <div class="club-selector-bar">
                <button class="club-btn active" data-index="0" onclick="selectClub(0)">Mobile App</button>
                <button class="club-btn" data-index="1" onclick="selectClub(1)">Courses</button>
                <button class="club-btn" data-index="2" onclick="selectClub(2)">Score Card</button>
                <button class="club-btn" data-index="3" onclick="selectClub(3)">Rewards</button>
                <button class="club-btn" data-index="4" onclick="selectClub(4)">Make Report</button>
            </div>
        </div>

    </div>

    <!-- Auth Modal Component -->
    <div id="auth-modal" class="auth-modal-overlay" onclick="handleModalBackdropClick(event)">
        <div class="auth-modal-card">
            <button class="auth-modal-close" onclick="closeAuthModal()" aria-label="Close modal">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <div class="auth-tabs">
                <button id="auth-tab-login" class="auth-tab-btn active" onclick="switchAuthTab('login')">Sign
                    In</button>
                <button id="auth-tab-register" class="auth-tab-btn" onclick="switchAuthTab('register')">Create
                    Account</button>
            </div>

            <div id="auth-alert-box" class="auth-alert"></div>

            <!-- Login Form -->
            <form id="auth-login-form" onsubmit="handleLoginSubmit(event)">
                <div class="auth-form-group">
                    <label class="auth-form-label" for="login-username">Username or Email</label>
                    <input type="text" id="login-username" class="auth-input" required
                        placeholder="Enter username or email" autocomplete="username">
                </div>
                <div class="auth-form-group">
                    <label class="auth-form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="auth-input" required placeholder="••••••••"
                        autocomplete="current-password">
                </div>
                <button type="submit" id="login-submit-btn" class="auth-submit-btn">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="auth-register-form" style="display: none;" onsubmit="handleRegisterSubmit(event)">
                <div class="auth-form-group">
                    <label class="auth-form-label" for="reg-username">Username</label>
                    <input type="text" id="reg-username" class="auth-input" required placeholder="Choose a username"
                        autocomplete="username">
                </div>
                <div class="auth-form-group">
                    <label class="auth-form-label" for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="auth-input" required placeholder="golfer@example.com"
                        autocomplete="email">

        // -------------------------------------------------------------------------

        function createFairwayGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#113b24';
            ctx.fillRect(0, 0, 1024, 1024);

            const stripeWidth = 128;
            for (let x = 0; x < 1024; x += stripeWidth * 2) {
                ctx.fillStyle = '#174e30';
                ctx.fillRect(x, 0, stripeWidth, 1024);
            }

            for (let i = 0; i < 40000; i++) {
                const rx = Math.random() * 1024;
                const ry = Math.random() * 1024;
                const shade = Math.random() > 0.5 ? '#1f633d' : '#0c2d1b';
                ctx.fillStyle = shade;
                ctx.fillRect(rx, ry, Math.random() * 2 + 1, Math.random() * 4 + 2);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(8, 8);
            return texture;
        }

        function createGolfBallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 256, 256);

            ctx.fillStyle = '#d5dde6';
            for (let x = 8; x < 256; x += 16) {
                for (let y = 8; y < 256; y += 16) {
                    ctx.beginPath();
                    ctx.arc(x + ((y / 16) % 2) * 8, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createPebbleLeatherTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#808080';
            ctx.fillRect(0, 0, 512, 512);

            // Fine organic pebble noise
            const imgData = ctx.getImageData(0, 0, 512, 512);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const n = (Math.random() - 0.5) * 45;
                data[i] = Math.min(255, Math.max(0, 128 + n));
                data[i + 1] = Math.min(255, Math.max(0, 128 + n));
                data[i + 2] = Math.min(255, Math.max(0, 128 + n));
            }
            ctx.putImageData(imgData, 0, 0);

            // Pebble cell stipples
            for (let i = 0; i < 2800; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const r = Math.random() * 3.5 + 1.5;
                const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad.addColorStop(0, 'rgba(210, 210, 210, 0.45)');
                grad.addColorStop(0.7, 'rgba(128, 128, 128, 0.2)');
                grad.addColorStop(1, 'rgba(40, 40, 40, 0.5)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(4, 4);
            return tex;
        }

        function createCarbonFiberTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#16191d';
            ctx.fillRect(0, 0, 64, 64);

            const size = 16;
            for (let x = 0; x < 64; x += size) {
                for (let y = 0; y < 64; y += size) {
                    const isAlt = ((x / size) + (y / size)) % 2 === 0;
                    ctx.fillStyle = isAlt ? '#2b303a' : '#111418';
                    ctx.fillRect(x, y, size, size);

                    // Micro twill weave lines
                    ctx.strokeStyle = isAlt ? '#3a424e' : '#080a0c';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    if (isAlt) {
                        ctx.moveTo(x, y);
                        ctx.lineTo(x + size, y + size);
                    } else {
                        ctx.moveTo(x + size, y);
                        ctx.lineTo(x, y + size);
                    }
                    ctx.stroke();
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(6, 6);
            return tex;
        }

        function createMeshFabricTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#18201a';
            ctx.fillRect(0, 0, 64, 64);

            ctx.fillStyle = '#0a0e0b';
            for (let x = 4; x < 64; x += 8) {
                for (let y = 4; y < 64; y += 8) {
                    const offset = ((y / 8) % 2) * 4;
                    ctx.beginPath();
                    ctx.arc(x + offset, y, 2.2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(4, 4);
            return tex;
        }

        function createBagEmblemTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Outer gold bevel ring

            grad.addColorStop(0, '#d4af37');
            grad.addColorStop(0.5, '#fff2a8');
            grad.addColorStop(1, '#997a15');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(128, 128, 124, 0, Math.PI * 2);

            // Inner dark emerald enamel core

            ctx.arc(128, 128, 102, 0, Math.PI * 2);

        function init() {

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            renderer.toneMappingExposure = 1.35;

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 4.5;
            controls.maxDistance = 16;
            controls.maxPolarAngle = Math.PI / 2 - 0.04;
            controls.target.set(0.4, 2.6, 0);

            // Lighting & Atmosphere

            setupGolfBag();

            // Raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            container.addEventListener('pointerdown', onPointerDown);

            // Keyboard Navigation (Arrow Keys & Number Keys 1-6)
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    const nextIndex = (selectedIndex + 1) % CLUBS.length;
                    selectClub(nextIndex);
                } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    const prevIndex = (selectedIndex - 1 + CLUBS.length) % CLUBS.length;
                    selectClub(prevIndex);
                } else {
                    const num = parseInt(e.key);
                    if (!isNaN(num) && num >= 1 && num <= CLUBS.length) {
                        selectClub(num - 1);
                    }
                }
            });

            // Default Select Driver
            selectClub(0, true);

            // Animation Loop
            animate();
        }

        function setupGreenGrassField() {
            const grassTex = createFairwayGrassTexture();

            const groundGeo = new THREE.PlaneGeometry(80, 80, 32, 32);
            const groundMat = new THREE.MeshStandardMaterial({
                map: grassTex,
                roughness: 0.85,
                metalness: 0.1,
                color: 0x228b4c
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = 0;
            ground.receiveShadow = true;
            scene.add(ground);

            const bladeCount = 38000;
            const bladeGeo = new THREE.ConeGeometry(0.025, 0.28, 3);
            bladeGeo.translate(0, 0.14, 0);

            const bladeMat = new THREE.MeshStandardMaterial({
                color: 0x1e7e45,
                roughness: 0.6,
                metalness: 0.05,
                flatShading: true
            });

            grassInstancedMesh = new THREE.InstancedMesh(bladeGeo, bladeMat, bladeCount);
            grassInstancedMesh.receiveShadow = true;

            const dummy = new THREE.Object3D();
            const radius = 21; // Tripled from 9.5

            for (let i = 0; i < bladeCount; i++) {
                const r = Math.sqrt(Math.random()) * radius;
                const theta = Math.random() * Math.PI * 2;
                const x = r * Math.cos(theta);
                const z = r * Math.sin(theta);

                if (x * x + z * z < 0.6) continue;

                dummy.position.set(x, 0, z);
                dummy.rotation.y = Math.random() * Math.PI * 2;
                dummy.rotation.x = (Math.random() - 0.5) * 0.35;
                dummy.rotation.z = (Math.random() - 0.5) * 0.35;

                const scaleH = Math.random() * 0.6 + 0.7;
                dummy.scale.set(1, scaleH, 1);
                dummy.updateMatrix();

                grassInstancedMesh.setMatrixAt(i, dummy.matrix);
            }
            grassInstancedMesh.instanceMatrix.needsUpdate = true;
            scene.add(grassInstancedMesh);

            // Ball & Wooden Tee
            const ballGroup = new THREE.Group();
            ballGroup.position.set(1.4, 0, 1.2);

            const teeGeo = new THREE.CylinderGeometry(0.015, 0.005, 0.25, 12);

            const ballGeo = new THREE.SphereGeometry(0.09, 32, 32);

                color: 0xffffff,

                clearcoat: 0.9,
                clearcoatRoughness: 0.1

        function createSolidForgedBladeGeometry() {
            const shape = new THREE.Shape();
            shape.moveTo(0, 0); // Heel
            shape.bezierCurveTo(0.12, -0.05, 0.48, -0.08, 0.68, 0.04); // Cambered sole
            shape.bezierCurveTo(0.78, 0.14, 0.76, 0.32, 0.62, 0.44); // Rounded high toe
            shape.bezierCurveTo(0.42, 0.48, 0.14, 0.44, 0.02, 0.36); // Chamfered top line
            shape.bezierCurveTo(-0.02, 0.22, -0.02, 0.08, 0, 0); // Hosel junction

            const extrudeSettings = {
                steps: 2,
                depth: 0.09,
                bevelEnabled: true,
                bevelThickness: 0.03,
                bevelSize: 0.03,
                bevelOffset: 0,
                bevelSegments: 4
            };

            return new THREE.ExtrudeGeometry(shape, extrudeSettings);
        }

            ctx.strokeStyle = '#d4af37';

            ctx.strokeRect(8, 8, 496, 112);

            ctx.strokeStyle = 'rgba(212, 175, 55, 0.4)';

            ctx.textAlign = 'center';

            ctx.letterSpacing = '2px';

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;

                const ferruleGeo = new THREE.CylinderGeometry(0.036, 0.036, 0.14, 16);
                const ferruleMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.2 });
                const ferrule = new THREE.Mesh(ferruleGeo, ferruleMat);
                ferrule.position.y = clubData.shaftLength - 0.07;
                clubContainer.add(ferrule);

                const ring1 = new THREE.Mesh(new THREE.CylinderGeometry(0.037, 0.037, 0.015, 16), goldTrimMat);
                ring1.position.y = clubData.shaftLength - 0.03;
                clubContainer.add(ring1);

                // 4. Solid Head Assembly
                const headGroup = new THREE.Group();
                headGroup.position.set(0, clubData.shaftLength, 0);

                const loftRad = clubData.loft * Math.PI / 180;

                // Hosel Neck
                const hoselGeo = new THREE.CylinderGeometry(0.034, 0.034, 0.22, 16);
                const hosel = new THREE.Mesh(hoselGeo, mirrorChromeMat);
                hosel.position.set(0, -0.04, 0);
                hosel.rotation.z = -0.15;
                headGroup.add(hosel);

                // Solid Forged Chrome Blade Body
                const blade = new THREE.Mesh(solidBladeGeo, mirrorChromeMat);
                blade.position.set(0.04, 0.02, 0.02);
                blade.rotation.set(-loftRad * 0.35, 0.32, -0.12);
                blade.castShadow = true;
                headGroup.add(blade);

                // Integrated Gold Cavity Accent
                const cavityGeo = new THREE.BoxGeometry(0.38, 0.20, 0.03);
                const cavity = new THREE.Mesh(cavityGeo, goldTrimMat);
                cavity.position.set(0.34, 0.16, -0.035);
                cavity.rotation.set(-loftRad * 0.35, 0.32, -0.12);
                headGroup.add(cavity);

                // Page Name Plaque on the Club Hitting Head / Face (Back & Front visibility)
                const nameTex = createClubNameTexture(clubData.name);
                const plaqueMat = new THREE.MeshStandardMaterial({
                    map: nameTex,
                    roughness: 0.25,
                    metalness: 0.7,
                    transparent: false
                });

                // Name Plate positioned clearly on the club head face
                const plaqueGeo = new THREE.PlaneGeometry(0.46, 0.13);

                // Front face
                const namePlaqueFront = new THREE.Mesh(plaqueGeo, plaqueMat);
                namePlaqueFront.position.set(0.35, 0.18, 0.125);
                namePlaqueFront.rotation.set(-loftRad * 0.35, 0.32, -0.12);
                headGroup.add(namePlaqueFront);

                // Back / Cavity face
                const namePlaqueBack = new THREE.Mesh(plaqueGeo, plaqueMat);
                namePlaqueBack.position.set(0.35, 0.18, -0.052);
                namePlaqueBack.rotation.set(-loftRad * 0.35, 0.32 + Math.PI, -0.12);
                headGroup.add(namePlaqueBack);

                // Generous Interactive Click Hitbox
                const hitGeo = new THREE.SphereGeometry(0.72, 12, 12);
                const hitMat = new THREE.MeshBasicMaterial({ visible: false });
                const hit = new THREE.Mesh(hitGeo, hitMat);
                hit.position.y = clubData.shaftLength + 0.1;
                hit.userData = { clubIndex: idx };
                clubContainer.add(hit);

                clubContainer.add(headGroup);
                bagGroup.add(clubContainer);
                clubs.push(clubContainer);
            });
        }

        // -------------------------------------------------------------------------
        // Silky Smooth Club Selection & Camera Focus
        // -------------------------------------------------------------------------
        function selectClub(index, skipTween = false) {
            if (index < 0 || index >= CLUBS.length) return;
            selectedIndex = index;
            const data = CLUBS[index];

            // 1. Update UI Elements
            document.querySelectorAll('.club-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });

            const heroDisplay = document.getElementById('hero-display');
            const heroTitle = document.getElementById('hero-title');
            const heroDesc = document.getElementById('hero-desc');
            const heroLink = document.getElementById('hero-link');

            heroTitle.textContent = data.name;
            heroDesc.textContent = data.desc;

            if (data.page) {
                heroLink.href = data.page;
                heroLink.classList.remove('disabled');
                heroLink.removeAttribute('aria-disabled');
                heroLink.onclick = null;
            } else {
                heroLink.href = 'javascript:void(0)';
                heroLink.classList.add('disabled');
                heroLink.setAttribute('aria-disabled', 'true');
                heroLink.onclick = (e) => { e.preventDefault(); return false; };
            }
            heroLink.querySelector('span').textContent = data.name === 'Make Report' ? 'Make Report' : `Explore ${data.name}`;

            if (!skipTween) {
                gsap.fromTo(heroDisplay,
                    { opacity: 0, x: -20 },
                    { opacity: 1, x: 0, duration: 0.45, ease: 'power2.out' }
                );
            }

            // 2. Animate 3D Clubs
            clubs.forEach((clubMesh, i) => {
                const isTarget = (i === index);
                const uData = clubMesh.userData;

                if (isTarget) {
                    gsap.to(clubMesh.position, {
                        x: uData.elevatedPos.x,
                        y: uData.elevatedPos.y,
                        z: uData.elevatedPos.z,
                        duration: 0.7,
                        ease: 'back.out(1.4)'
                    });
                    gsap.to(clubMesh.rotation, {
                        x: uData.elevatedRot.x,
                        y: uData.elevatedRot.y,
                        z: uData.elevatedRot.z,
                        duration: 0.7,
                        ease: 'power2.out'
                    });
                } else {
                    gsap.to(clubMesh.position, {
                        x: uData.restingPos.x,
                        y: uData.restingPos.y,
                        z: uData.restingPos.z,
                        duration: 0.5,
                        ease: 'power2.inOut'
                    });
                    gsap.to(clubMesh.rotation, {
                        x: uData.restingRot.x,
                        y: uData.restingRot.y,
                        z: uData.restingRot.z,
                        duration: 0.5,
                        ease: 'power2.inOut'
                    });
                }
            });

            // 3. Smooth Camera Refocus
            const targetPos = clubs[index].userData.elevatedPos;
            gsap.to(controls.target, {
                x: targetPos.x * 0.35 + 0.3,
                y: targetPos.y + 0.8,
                z: targetPos.z * 0.35,
                duration: 0.9,
                ease: 'power2.out'
            });
        }

        // -------------------------------------------------------------------------
        // 3D Pointer & Direct Click Interaction
        // -------------------------------------------------------------------------
        function onPointerDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            for (let i = 0; i < intersects.length; i++) {
                const hit = intersects[i].object;
                if (hit.userData && typeof hit.userData.clubIndex === 'number') {
                    selectClub(hit.userData.clubIndex);
                    break;
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // -------------------------------------------------------------------------
        // Animation Loop
        // -------------------------------------------------------------------------
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            controls.update();

            // Subtle Fairway Grass Sway
            if (grassInstancedMesh) {
                grassInstancedMesh.rotation.y = Math.sin(elapsedTime * 0.6) * 0.005;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('DOMContentLoaded', () => {
            init();
            initAuthUI();
        });

        // -------------------------------------------------------------------------
        // Authentication UI Handlers
        // -------------------------------------------------------------------------
        function initAuthUI() {
            updateAuthHeader();
            window.addEventListener('mpg-auth-change', updateAuthHeader);

            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                const badge = document.getElementById('header-user-badge');
                const dropdown = document.getElementById('header-user-dropdown');
                if (badge && dropdown && !badge.contains(e.target)) {
                    dropdown.classList.remove('show');
                }
            });
        }

        function updateAuthHeader() {
            const loginBtn = document.getElementById('header-login-btn');
            const userBadge = document.getElementById('header-user-badge');
            const avatarEl = document.getElementById('header-user-avatar');
            const nameEl = document.getElementById('header-user-name');
            const pointsEl = document.getElementById('header-user-points');

            const user = window.Auth ? window.Auth.getUser() : null;

            if (user && user.username) {
                if (loginBtn) loginBtn.style.display = 'none';
                if (userBadge) userBadge.style.display = 'inline-flex';
                if (avatarEl) avatarEl.textContent = user.username.charAt(0).toUpperCase();
                if (nameEl) nameEl.textContent = user.username;
                if (pointsEl) pointsEl.textContent = `${user.points || 0} PTS`;
            } else {
                if (loginBtn) loginBtn.style.display = 'inline-flex';
                if (userBadge) userBadge.style.display = 'none';
            }
        }

        function toggleUserDropdown(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('header-user-dropdown');
            if (dropdown) {
                dropdown.classList.toggle('show');
            }
        }

        function handleLogout(e) {
            if (e) e.stopPropagation();
            if (window.Auth) {
                window.Auth.logout();
            }
            const dropdown = document.getElementById('header-user-dropdown');
            if (dropdown) dropdown.classList.remove('show');
        }

        function openAuthModal(mode = 'login') {
            const modal = document.getElementById('auth-modal');
            if (modal) {
                switchAuthTab(mode);
                modal.classList.add('active');
            }
        }

        function closeAuthModal() {
            const modal = document.getElementById('auth-modal');
            if (modal) {
                modal.classList.remove('active');
            }
            clearAuthAlert();
        }

        function handleModalBackdropClick(e) {
            if (e.target.id === 'auth-modal') {
                closeAuthModal();
            }
        }

        function switchAuthTab(mode) {
            const tabLogin = document.getElementById('auth-tab-login');
            const tabRegister = document.getElementById('auth-tab-register');
            const formLogin = document.getElementById('auth-login-form');
            const formRegister = document.getElementById('auth-register-form');

            clearAuthAlert();

            if (mode === 'register') {
                tabLogin.classList.remove('active');
                tabRegister.classList.add('active');
                formLogin.style.display = 'none';
                formRegister.style.display = 'block';
            } else {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                formLogin.style.display = 'block';
                formRegister.style.display = 'none';
            }
        }

        function showAuthAlert(msg, type = 'error') {
            const alertBox = document.getElementById('auth-alert-box');
            if (alertBox) {
                alertBox.className = `auth-alert ${type}`;
                alertBox.textContent = msg;
                alertBox.style.display = 'block';
            }
        }

        function clearAuthAlert() {
            const alertBox = document.getElementById('auth-alert-box');
            if (alertBox) {
                alertBox.style.display = 'none';
                alertBox.textContent = '';
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('login-submit-btn');
            const usernameInput = document.getElementById('login-username').value;
            const passwordInput = document.getElementById('login-password').value;

            clearAuthAlert();
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                await window.Auth.login(usernameInput, passwordInput);
                showAuthAlert('✓ Welcome back!', 'success');
                setTimeout(() => {
                    closeAuthModal();
                    document.getElementById('auth-login-form').reset();
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                }, 600);
            } catch (err) {
                showAuthAlert(err.message || 'Login failed', 'error');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('reg-submit-btn');
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            clearAuthAlert();
            btn.disabled = true;
            btn.textContent = 'Creating Account...';

            try {
                await window.Auth.register(username, email, password);
                showAuthAlert('✓ Account created successfully! Default points: 0', 'success');
                setTimeout(() => {
                    closeAuthModal();
                    document.getElementById('auth-register-form').reset();
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                }, 800);
            } catch (err) {
                showAuthAlert(err.message || 'Registration failed', 'error');
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        }
    </script>
    <!-- Include Authentication Module -->
    <script src="auth.js?v=2"></script>
