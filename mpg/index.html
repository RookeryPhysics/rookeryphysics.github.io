<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPG App Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b, #0f172a 80%);
      font-family: 'Outfit', sans-serif;
      color: #f8fafc;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background light spheres */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 320px;
      height: 320px;
      background: #3b82f6;
      top: 15%;
      left: 20%;
    }
    .orb-2 {
      width: 360px;
      height: 360px;
      background: #8b5cf6;
      bottom: 15%;
      right: 20%;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 1.5rem;
    }

    /* Floating bouncing animation */
    @keyframes floatBounce {
      0%, 100% {
        transform: translateY(0);
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5),
                    0 0 25px 2px rgba(59, 130, 246, 0.25);
      }
      50% {
        transform: translateY(-16px);
        box-shadow: 0 32px 50px -12px rgba(0, 0, 0, 0.4),
                    0 0 40px 6px rgba(139, 92, 246, 0.35);
      }
    }

    /* Link wrapper */
    .phone-link {
      display: block;
      text-decoration: none;
      color: inherit;
      outline: none;
      transition: transform 0.25s ease, filter 0.25s ease;
      cursor: pointer;
    }

    .phone-link:hover {
      transform: scale(1.035);
      filter: brightness(1.05);
    }

    .phone-link:active {
      transform: scale(0.985);
    }

    /* Phone Mockup Frame */
    .phone-frame {
      width: 290px;
      height: 560px;
      background: #090d16;
      border-radius: 46px;
      border: 10px solid #1e293b;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5),
                  0 0 25px 2px rgba(59, 130, 246, 0.25);
      position: relative;
      overflow: hidden;
      animation: floatBounce 4s ease-in-out infinite;
      transition: border-color 0.3s ease;
    }

    .phone-link:hover .phone-frame {
      border-color: #3b82f6;
    }

    /* Phone Speaker / Dynamic Island */
    .notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 18px;
      background: #020617;
      border-radius: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 8px;
    }

    .camera-lens {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #1e293b;
      box-shadow: inset 0 0 2px #0ea5e9;
    }

    /* Screen with scaled iframe */
    .screen-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      background: #ffffff;
      border-radius: 36px;
    }

    .preview-iframe {
      width: 375px;
      height: 720px;
      border: none;
      pointer-events: none; /* Clicking passes directly to parent link */
      transform-origin: 0 0;
      transform: scale(0.72);
    }

    /* Overlay sheen/glass effect */
    .screen-sheen {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(255, 255, 255, 0) 50%
      );
      pointer-events: none;
      z-index: 5;
    }

    /* Indicator pill */
    .tap-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 1.25rem;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      backdrop-filter: blur(12px);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.25s ease;
    }

    .tap-indicator svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #38bdf8;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: pulseTap 1.5s ease-in-out infinite;
    }

    @keyframes pulseTap {
      0%, 100% {
        transform: scale(1) translateY(0);
      }
      50% {
        transform: scale(1.2) translateY(-2px);
        stroke: #818cf8;
      }
    }

    .phone-link:hover .tap-indicator {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(96, 165, 250, 0.5);
      color: #93c5fd;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
    }
  </style>
</head>
<body>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <div class="container">
    <a href="app.html" class="phone-link" aria-label="Open MPG App">
      <div class="phone-frame">
        <div class="notch">
          <div class="camera-lens"></div>
        </div>
        <div class="screen-sheen"></div>
        <div class="screen-container">
          <iframe src="app.html" title="App Preview" class="preview-iframe" scrolling="no" tabindex="-1"></iframe>
        </div>
      </div>
    </a>

    <a href="app.html" class="phone-link" aria-label="Click to open MPG App">
      <div class="tap-indicator">
        <svg viewBox="0 0 24 24">
          <path d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239a9 9 0 0 0-4.949 4.95m0 9.622a9 9 0 0 0 4.95 4.95m9.623 0a9 9 0 0 0 4.95-4.95M16.812 2.24a9 9 0 0 0-4.95-1.24" />
        </svg>
        <span>Click phone to launch App</span>
      </div>
    </a>
  </div>
</body>
</html>
