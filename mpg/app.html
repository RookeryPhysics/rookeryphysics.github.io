<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MULTIPLAYED App</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QRCode.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Righteous&family=Russo+One&family=Kanit:ital,wght@1,900&display=swap"
        rel="stylesheet">

    <style>
        @keyframes golfBallBounceLeftToRight {
            0% {
                opacity: 0;
                transform: translate3d(-220px, -100px, 0) rotate(-15deg);
                animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53);
            }

            25% {
                opacity: 1;
                transform: translate3d(-130px, 0px, 0) rotate(-8deg);
                animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }

            42% {
                transform: translate3d(-75px, -45px, 0) rotate(-3deg);
                animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53);
            }

            58% {
                transform: translate3d(-35px, 0px, 0) rotate(0deg);
                animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }

            72% {
                transform: translate3d(-16px, -18px, 0) rotate(2deg);
                animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53);
            }

            84% {
                transform: translate3d(-5px, 0px, 0) rotate(0deg);
                animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }

            92% {
                transform: translate3d(-1px, -4px, 0) rotate(1deg);
                animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53);
            }

            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0) rotate(0deg);
            }
        }

        .multiplayed-title {
            font-family: 'Righteous', 'Russo One', 'Kanit', sans-serif;
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #E6D7B8;
            /* Light tan */
            text-shadow:
                -1px -1px 0 #0a2419,
                1px -1px 0 #0a2419,
                -1px 1px 0 #0a2419,
                1px 1px 0 #0a2419,
                0 2px 5px rgba(0, 0, 0, 0.4);
            display: inline-block;
            transform-origin: bottom center;
            animation: golfBallBounceLeftToRight 1.5s linear both;
            cursor: pointer;
            user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            /* Dark background outside the phone container on desktop */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            overflow: hidden;
        }

        /* Phone container styling to look like a device on desktop */
        #device-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: #f3f4f6;
            position: relative;
            box-shadow: 0 0 0 rgba(0, 0, 0, 0);
        }

        /* Media query to make it look like a phone on larger screens */
        @media (min-width: 480px) {
            #device-container {
                width: 390px;
                /* Standard phone width */
                height: 844px;
                max-height: 90vh;
                /* Standard phone height */
                border-radius: 40px;
                border: 12px solid #0f0f0f;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
                overflow: hidden;
            }
        }

        /* App internal layout */
        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            background-color: #f9fafb;
            overflow: hidden;
        }

        /* Hide scrollbar for cleaner look */
        .scrollable-content::-webkit-scrollbar {
            display: none;
        }

        .scrollable-content {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Custom Floating Action Button styling to match Wendy's 'Order' button */
        .center-nav-item {
            position: relative;
            width: 20%;
            display: flex;
            justify-content: center;
        }

        .floating-btn-wrapper {
            position: absolute;
            top: -28px;
            /* Push it up above the nav bar */
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
        }

        .floating-btn {
            width: 72px;
            height: 72px;
            /* 3D sphere lighting with dimple pattern */
            background-color: #ffffff;
            background-image:
                radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.2) 35%, rgba(180, 190, 205, 0.6) 80%, rgba(130, 140, 160, 0.9) 100%),
                radial-gradient(#b8c2cc 18%, transparent 22%),
                radial-gradient(#b8c2cc 18%, transparent 22%);
            background-position: 0 0, 0 0, 5px 5px;
            background-size: 100% 100%, 10px 10px, 10px 10px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #1b4332;
            box-shadow:
                0 10px 18px -3px rgba(0, 0, 0, 0.25),
                0 4px 6px -2px rgba(0, 0, 0, 0.15),
                inset 0 -5px 10px rgba(0, 0, 0, 0.25),
                inset 0 3px 6px rgba(255, 255, 255, 0.9);
            border: 4px solid #ffffff;
            position: relative;
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
        }

        .floating-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 14px 22px -3px rgba(0, 0, 0, 0.28),
                0 6px 8px -2px rgba(0, 0, 0, 0.18),
                inset 0 -5px 10px rgba(0, 0, 0, 0.25),
                inset 0 3px 6px rgba(255, 255, 255, 0.9);
        }

        .floating-btn:active {
            transform: scale(0.94) translateY(1px);
        }

        /* Bottom Nav styling */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            background-color: #ffffff;
            /* Curved top corners to match reference somewhat */
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.05);
            padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 40;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 20%;
            color: #6b7280;
            /* Gray-500 */
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
            gap: 4px;
        }

        .nav-item.active {
            color: #0066cc;
            /* Blue */
        }

        .nav-icon {
            width: 24px;
            height: 24px;
        }
    </style>
</head>

<body>

    <div id="device-container">
        <div class="app-layout">

            <!-- Top Header Area -->
            <header
                class="bg-[#1b4332] text-white px-4 pb-3.5 pt-5 flex flex-col gap-2 rounded-b-2xl shadow-sm z-10">
                <!-- Brand Name and Logo -->
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2.5">
                        <img src="logo.jpeg" alt="MULTIPLAYED Logo"
                            class="w-10 h-10 rounded-full object-cover border border-white/20 shadow-sm">
                        <div class="flex flex-col">
                            <h1 id="multiplayed-text" class="multiplayed-title" onclick="triggerGolfBounce()"
                                title="Click to bounce!">MULTIPLAYED</h1>
                        </div>
                    </div>

                    <!-- Points Area (Interactive) -->
                    <div id="header-points-pill" onclick="handleHeaderPointsClick()"
                        class="flex items-center bg-black/20 border border-yellow-500/30 px-3 py-1.5 rounded-full cursor-pointer hover:bg-black/30 transition-all hover:scale-105 active:scale-95 shadow-sm">
                        <div id="header-points-avatar"
                            class="bg-gradient-to-tr from-yellow-500 to-amber-300 rounded-full w-5 h-5 flex items-center justify-center mr-1.5 shadow-sm">
                            <span id="header-points-avatar-char" class="text-[#1b4332] text-[10px] font-black">U</span>
                        </div>
                        <span id="header-points-val" class="font-bold text-sm tracking-tight text-amber-200">0 Points</span>
                    </div>
                </div>

                <!-- Sub-header: Welcome (userName) & Date -->
                <div id="header-user-bar" class="flex justify-between items-center text-xs border-t border-white/10 pt-2 px-0.5 min-h-[26px]">
                    <!-- Welcome message (shown only when logged in) -->
                    <div id="welcome-message-container" class="hidden items-center font-semibold text-emerald-100 min-w-0 pr-2">
                        <span class="truncate">Welcome, <span id="welcome-user-name" class="text-amber-300 font-bold"></span>!</span>
                    </div>
                    <!-- Current Date -->
                    <div id="header-date-container" class="text-[11px] text-emerald-200/90 font-medium ml-auto flex items-center gap-1 shrink-0">
                        <i data-lucide="calendar" class="w-3 h-3 text-emerald-300"></i>
                        <span id="header-current-date"></span>
                    </div>
                </div>
            </header>

            <!-- Scrollable Main Content -->
            <main id="main-content" class="flex-1 overflow-y-auto scrollable-content pb-32">
                <!-- Main Promo Banner -->
                <div class="p-4">
                    <div class="rounded-xl p-0 overflow-hidden shadow-md relative h-40 flex items-center bg-green-700"
                        style="background-image: url('https://images.unsplash.com/photo-1533460004989-cef01064af7e?auto=format&fit=crop&w=600&q=80'); background-size: cover; background-position: center;">
                        <!-- Dark overlay for text readability -->
                        <div class="absolute inset-0 bg-gradient-to-r from-black/70 to-black/20"></div>

                        <div class="p-5 z-10 w-full relative">
                            <h2 class="text-white text-2xl font-extrabold italic mb-1 leading-tight drop-shadow-md">HIT
                                THE<br>GREENS!</h2>
                            <div class="mt-3 flex items-center gap-3">
                                <button disabled
                                    class="bg-white/60 text-gray-500 text-xs font-bold py-1.5 px-4 rounded-full uppercase tracking-wider shadow-sm cursor-not-allowed border border-white/20">
                                    Book Tee Time
                                </button>
                                <span
                                    class="text-[11px] font-bold text-emerald-100/90 tracking-wide uppercase bg-black/30 px-2.5 py-1 rounded-full backdrop-blur-sm border border-white/10">
                                    Coming Soon
                                </span>
                            </div>
                        </div>
                    </div>
                    <!-- Extra space at bottom to ensure content isn't hidden by nav bar -->
                    <div class="h-8"></div>
                </div>
            </main>

            <!-- Bottom Navigation Bar based on sketch -->
            <nav class="bottom-nav">
                <!-- Home -->
                <a href="#" id="home-btn" class="nav-item active">
                    <i data-lucide="home" class="nav-icon"></i>
                    <span>Home</span>
                </a>

                <!-- Report -->
                <a href="#" id="report-btn" class="nav-item hover:text-gray-900 transition-colors">
                    <i data-lucide="flag" class="nav-icon"></i>
                    <span>Report</span>
                </a>

                <!-- Courses (Center Prominent Button) -->
                <div class="center-nav-item">
                    <div class="floating-btn-wrapper">
                        <button id="courses-btn" class="floating-btn">
                            <i data-lucide="flag-triangle-right"
                                class="w-8 h-8 mb-0.5 text-emerald-800 drop-shadow-[0_1px_1px_rgba(255,255,255,0.8)]"></i>
                            <span
                                class="text-[10px] font-bold text-gray-900 drop-shadow-[0_1px_1px_rgba(255,255,255,0.8)]">Courses</span>
                        </button>
                    </div>
                </div>

                <!-- Scan -->
                <a href="#" id="scan-btn" class="nav-item hover:text-gray-900 transition-colors">
                    <i data-lucide="qr-code" class="nav-icon"></i>
                    <span>Scan</span>
                </a>

                <!-- Account -->
                <a href="#" id="account-btn" class="nav-item hover:text-gray-900 transition-colors">
                    <i data-lucide="user" class="nav-icon"></i>
                    <span>Account</span>
                </a>
            </nav>

            <!-- Modal Overlay -->
            <div id="modal"
                class="hidden absolute inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity">
                <!-- Modal Container with Close Button -->
                <div
                    class="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl relative min-h-[220px] flex flex-col items-center justify-center border border-gray-100 animate-in fade-in zoom-in-95 duration-200">
                    <button id="close-modal-btn"
                        class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 p-1.5 rounded-full hover:bg-gray-100 transition-colors"
                        aria-label="Close modal">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                    <div id="modal-body" class="w-full flex-1 flex items-center justify-center">
                        <!-- Dynamic modal content -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Initialize Icons, Auth & Navigation Logic -->
    <script src="auth.js?v=2"></script>
    <script>
        lucide.createIcons();

        function triggerGolfBounce() {
            const el = document.getElementById('multiplayed-text');
            if (el) {
                el.style.animation = 'none';
                el.offsetHeight; /* trigger reflow */
                el.style.animation = 'golfBallBounceLeftToRight 1.5s linear both';
            }
        }

        // Modal & Navigation Controls
        const modal = document.getElementById('modal');
        const modalBody = document.getElementById('modal-body');
        const reportBtn = document.getElementById('report-btn');
        const scanBtn = document.getElementById('scan-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const accountBtn = document.getElementById('account-btn');
        const homeBtn = document.getElementById('home-btn');
        const coursesBtn = document.getElementById('courses-btn');
        const mainContent = document.getElementById('main-content');

        // Store original home content HTML
        const homeContentHTML = mainContent ? mainContent.innerHTML : '';

        function openModal(contentHtml) {
            if (modal) {
                if (contentHtml && modalBody) {
                    modalBody.innerHTML = contentHtml;
                    lucide.createIcons();
                }
                modal.classList.remove('hidden');
            }
        }

        async function closeModal(e) {
            if (e) e.preventDefault();
            if (modal) {
                modal.classList.add('hidden');
            }
            // Immediately refresh user points when closing modal (e.g., after QR code scan)
            if (window.Auth && window.Auth.isLoggedIn()) {
                try {
                    await window.Auth.refreshUser();
                    // If Account tab is currently active, re-render it to show updated points balance
                    if (accountBtn && accountBtn.classList.contains('active')) {
                        renderAccountView();
                    }
                } catch (err) {
                    console.warn('Auto points refresh on modal close failed:', err);
                }
            }
        }

        function setActiveNav(activeElement) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
                item.classList.remove('active');
            });
            if (activeElement) {
                activeElement.classList.add('active');
            }
        }

        function showHomeView(e) {
            if (e) e.preventDefault();
            if (mainContent) {
                mainContent.innerHTML = homeContentHTML;
                lucide.createIcons();
            }
            setActiveNav(homeBtn);
        }

        // ---------------------------------------------------------------------
        // BC Golf Courses & Tee Time Scraper Integration
        // ---------------------------------------------------------------------
        const APPS_SCRIPT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzix6ZwFnNDeMVjJ-Aj5VAgkqy22rnJqNb-xCfTtg0vYKYYUKw6w5IuDc4wfRYCb1Gefg/exec';

        const BC_COURSES = [
            { slug: 'arbutus-ridge-golf-club', name: 'Arbutus Ridge Golf Club', location: 'Cobble Hill, BC' },
            { slug: 'bear-mountain-resort', name: 'Bear Mountain Golf & Tennis Club', location: 'Victoria, BC' },
            { slug: 'big-sky-golf-club', name: 'Big Sky Golf Club', location: 'Pemberton, BC' },
            { slug: 'sechelt-golf-country-club', name: 'Blue Ocean Golf Club', location: 'Sechelt, BC' },
            { slug: 'country-meadows-golf-course', name: 'Country Meadows Golf Course', location: 'Richmond, BC' },
            { slug: 'fairview-mountain-golf-club', name: 'Fairview Mountain Golf Club', location: 'Oliver, BC' },
            { slug: 'fairmont-hot-springs', name: 'FHSR Mountainside & Creekside Golf Courses', location: 'Fairmont Hot Springs, BC' },
            { slug: 'westwood-plateau-golf-country-club', name: 'Fine - Greentee Country Club Westwood Plateau', location: 'Coquitlam, BC' },
            { slug: 'furry-creek-golf-country-club', name: 'Furry Creek Golf & Country Club', location: 'Furry Creek, BC' },
            { slug: 'golden-eagle-golf-club', name: 'Golden Eagle Golf Club', location: 'Pitt Meadows, BC' },
            { slug: 'greywolf-golf-course', name: 'Greywolf Golf Course', location: 'Panorama, BC' },
            { slug: 'kamloops-golf-country-club', name: 'Kamloops Golf & Country Club', location: 'Kamloops, BC' },
            { slug: 'kimberley-golf-club', name: 'Kimberley Golf Course', location: 'Kimberley, BC' },
            { slug: 'mission-creek-golf-club', name: 'Mission Creek Golf Club', location: 'Kelowna, BC' },
            { slug: 'morningstar-golf-club', name: 'Morningstar Golf Club', location: 'Parksville, BC' },
            { slug: 'revelstoke-golf-club', name: 'Revelstoke Golf Club', location: 'Revelstoke, BC' },
            { slug: 'sagebrush-golf-club', name: 'Sagebrush Golf Club', location: 'Quilchena, BC' },
            { slug: 'savage-creek', name: 'Savage Creek', location: 'Richmond, BC' },
            { slug: 'shuswap-national', name: 'Shuswap National', location: 'Salmon Arm, BC' },
            { slug: 'summerland-golf-country-club', name: 'Summerland Golf & Country Club', location: 'Summerland, BC' },
            { slug: 'the-links-at-hampton-cove', name: 'The Links at Hampton Cove', location: 'Delta, BC' },
            { slug: 'crown-isle-resort-golf-community', name: 'The Park at Crown Isle', location: 'Comox, BC' },
            { slug: 'the-rise-golf-course', name: 'The Rise Resort', location: 'Vernon, BC' },
            { slug: 'tower-ranch-golf-club', name: 'Tower Ranch Golf Club', location: 'Kelowna, BC' },
            { slug: 'tsawwassen-springs-golf', name: 'Tsawwassen Springs Golf', location: 'Delta, BC' },
            { slug: 'university-golf-club', name: 'University Golf Club', location: 'Vancouver, BC' },
            { slug: 'windermere-valley-golf-course', name: 'Windermere Valley Golf Course', location: 'Windermere, BC' }
        ];

        let selectedCourseObj = null;
        let currentTeeTimesList = [];

        // Render Courses List View
        function renderCoursesView(e) {
            if (e) e.preventDefault();
            setActiveNav(null); // Deselect other bottom tab links

            if (!mainContent) return;

            mainContent.innerHTML = `
                <div class="p-4 space-y-4 animate-in fade-in duration-300">
                    <!-- Page Header -->
                    <div class="flex justify-between items-center pt-1">
                        <div>
                            <h2 class="text-2xl font-black text-gray-900 tracking-tight">Courses</h2>
                            <p class="text-xs text-gray-500 mt-0.5">Select a course to view & scrape tee times</p>
                        </div>
                        <span id="courses-count-badge" class="px-2.5 py-1 bg-emerald-100 text-emerald-800 text-[11px] font-bold rounded-full border border-emerald-200">
                            ${BC_COURSES.length} Courses
                        </span>
                    </div>

                    <!-- Search Input -->
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="search" class="w-4 h-4"></i>
                        </div>
                        <input type="text" id="course-list-search"
                            placeholder="Search BC courses or cities..."
                            class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-200 rounded-2xl text-xs text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#1b4332] shadow-sm">
                    </div>

                    <!-- Courses Cards Grid -->
                    <div id="courses-items-container" class="space-y-2.5 pt-1">
                        <!-- Populated by filterCoursesList -->
                    </div>
                </div>
            `;

            lucide.createIcons();

            const searchInput = document.getElementById('course-list-search');
            if (searchInput) {
                searchInput.addEventListener('input', (ev) => {
                    filterCoursesList(ev.target.value);
                });
            }

            filterCoursesList('');
        }

        function filterCoursesList(queryText = '') {
            const container = document.getElementById('courses-items-container');
            const countBadge = document.getElementById('courses-count-badge');
            if (!container) return;

            const q = (queryText || '').toLowerCase().trim();
            const matches = BC_COURSES.filter(c => 
                !q || 
                c.name.toLowerCase().includes(q) || 
                c.location.toLowerCase().includes(q) || 
                c.slug.toLowerCase().includes(q)
            );

            if (countBadge) {
                countBadge.textContent = `${matches.length} Courses`;
            }

            if (matches.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-6 text-center border border-gray-100 shadow-sm">
                        <p class="text-xs text-gray-500">No golf courses match "${queryText}"</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = matches.map(c => `
                <div onclick="selectCourseDetail('${c.slug}')"
                    class="group bg-white hover:bg-emerald-50/50 active:scale-[0.99] border border-gray-100 hover:border-emerald-300/80 rounded-2xl p-4 shadow-sm transition-all duration-150 cursor-pointer flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3.5 min-w-0">
                        <div class="w-10 h-10 rounded-xl bg-emerald-100/70 text-emerald-800 flex items-center justify-center shrink-0 group-hover:bg-[#1b4332] group-hover:text-white transition-colors shadow-sm">
                            <i data-lucide="flag" class="w-5 h-5"></i>
                        </div>
                        <div class="min-w-0">
                            <h4 class="text-sm font-bold text-gray-900 tracking-tight truncate group-hover:text-emerald-900">${c.name}</h4>
                            <p class="text-[11px] text-gray-500 truncate flex items-center gap-1 mt-0.5">
                                <i data-lucide="map-pin" class="w-3 h-3 text-emerald-600 shrink-0"></i>
                                <span>${c.location}</span>
                            </p>
                        </div>
                    </div>
                    <div class="flex items-center text-gray-400 group-hover:text-emerald-700 shrink-0">
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        // ---------------------------------------------------------------------
        // Course Detail View & Tee Time Scraper (teetime_picker.html integrated)
        // ---------------------------------------------------------------------
        function selectCourseDetail(slug) {

        // Render Tee Times Table Rows
        function renderAppTeeTimesTable(teeTimes, meta) {
            const resultsSection = document.getElementById('app-results-section');
            const clubNameEl = document.getElementById('app-results-club-name');
            const dateBadgeEl = document.getElementById('app-results-date-badge');
            const countEl = document.getElementById('app-results-slot-count');

            if (!resultsSection) return;

            currentTeeTimesList = teeTimes || [];

            if (clubNameEl) clubNameEl.textContent = meta.clubName || (selectedCourseObj ? selectedCourseObj.name : 'Golf Course');
            if (dateBadgeEl) dateBadgeEl.textContent = meta.dateStr || 'Target Date';
            if (countEl) countEl.textContent = `${currentTeeTimesList.length} open slots`;

            resultsSection.classList.remove('hidden');
            renderAppTeeTimesRows();
        }

        function renderAppTeeTimesRows() {
            const tbody = document.getElementById('app-tee-times-tbody');
            if (!tbody) return;

            tbody.innerHTML = '';

            const timeFilterInput = document.getElementById('app-time-filter');
            const formatFilterInput = document.getElementById('app-format-filter');
            const timeQuery = timeFilterInput ? timeFilterInput.value.toLowerCase().trim() : '';
            const formatQuery = formatFilterInput ? formatFilterInput.value.toLowerCase().trim() : '';

            const filtered = currentTeeTimesList.filter(tt => {
                const matchTime = !timeQuery || (tt.time && tt.time.toLowerCase().includes(timeQuery));
                const matchFormat = !formatQuery || 
                    (tt.format && tt.format.toLowerCase().includes(formatQuery)) || 
                    (tt.hole && tt.hole.toLowerCase().includes(formatQuery));
                return matchTime && matchFormat;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="p-6 text-center text-xs text-gray-400 italic">
                            ${currentTeeTimesList.length === 0 ? 'No available tee times found for this date.' : 'No slots match your filter criteria.'}
                        </td>
                    </tr>
                `;
                return;
            }

            filtered.forEach(tt => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50/80 transition-colors';
                const price = tt.priceFormatted || (tt.price ? `$${Number(tt.price).toFixed(2)}` : 'N/A');
                const isPast = tt.status && tt.status.toLowerCase() === 'past';
                const statusBadgeClass = isPast ? 'bg-gray-100 text-gray-500' : 'bg-emerald-50 text-emerald-700 border border-emerald-200/60';

                tr.innerHTML = `
                    <td class="p-2.5 font-bold text-gray-900 whitespace-nowrap">${tt.time || '-'}</td>
                    <td class="p-2.5 text-gray-600 whitespace-nowrap">${tt.hole || '-'}</td>
                    <td class="p-2.5 text-gray-600 text-[11px]">${tt.format || '-'}</td>
                    <td class="p-2.5 whitespace-nowrap"><span class="px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700 font-bold text-[11px] border border-emerald-200/60">${price} ${tt.currency || 'CAD'}</span></td>
                    <td class="p-2.5 whitespace-nowrap"><span class="px-2 py-0.5 rounded-md text-[10px] font-semibold ${statusBadgeClass}">${tt.status || 'Open'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Handle Scrape & Sync Submit
        async function handleAppScrapeSubmit(e) {
            e.preventDefault();
            if (!selectedCourseObj) return;

            const dateInput = document.getElementById('app-target-date');
            const date = dateInput ? dateInput.value : '';
            const statusBox = document.getElementById('app-scrape-status-box');
            const submitBtn = document.getElementById('app-submit-scrape-btn');
            const spinner = document.getElementById('app-scrape-spinner');
            const btnText = document.getElementById('app-scrape-btn-text');

            if (submitBtn) submitBtn.disabled = true;
            if (spinner) spinner.classList.remove('hidden');
            if (btnText) btnText.textContent = 'Scraping...';
            if (statusBox) statusBox.className = 'hidden';

            try {
                const requestUrl = `${APPS_SCRIPT_WEB_APP_URL}?course=${encodeURIComponent(selectedCourseObj.slug)}&date=${encodeURIComponent(date)}`;
                const response = await fetch(requestUrl, { method: 'GET' });
                const result = await response.json();

                if (result.status === 'success') {
                    const d = result.data;
                    if (statusBox) {
                        statusBox.className = 'rounded-2xl p-3.5 text-xs bg-emerald-50 text-emerald-900 border border-emerald-200 shadow-sm block animate-in fade-in duration-200';
                        statusBox.innerHTML = `
                            <div class="font-bold flex items-center gap-1.5 text-emerald-800 mb-1">
                                <span>🎉</span> <span>Sheet Synced Successfully!</span>
                            </div>
                            <div class="text-[11px] text-emerald-700 mb-2">
                                Live tee times for <strong>${d.clubName}</strong> (${d.dateStr}) saved to Google Sheet.
                            </div>
                            <div class="grid grid-cols-3 gap-1.5 pt-2 border-t border-emerald-200/70 text-center">
                                <div class="bg-white/70 rounded-lg p-1.5">
                                    <div class="font-black text-sm text-emerald-800">${d.openSlots}</div>
                                    <div class="text-[9px] text-gray-500 font-semibold uppercase">Open</div>
                                </div>
                                <div class="bg-white/70 rounded-lg p-1.5">
                                    <div class="font-black text-sm text-gray-700">${d.soldOutCount}</div>
                                    <div class="text-[9px] text-gray-500 font-semibold uppercase">Sold Out</div>
                                </div>
                                <div class="bg-white/70 rounded-lg p-1.5">
                                    <div class="font-black text-sm text-gray-700">${d.naPriceCount}</div>
                                    <div class="text-[9px] text-gray-500 font-semibold uppercase">N/A Price</div>
                                </div>
                            </div>
                        `;
                    }

                    if (d.teeTimes && d.teeTimes.length > 0) {
                        renderAppTeeTimesTable(d.teeTimes, d);
                    } else {
                        handleAppLoadFromSheet();
                    }
                } else {
                    throw new Error(result.message || 'Scrape service returned an error.');
                }
            } catch (err) {
                if (statusBox) {
                    statusBox.className = 'rounded-2xl p-3.5 text-xs bg-red-50 text-red-900 border border-red-200 shadow-sm block animate-in fade-in duration-200';
                    statusBox.innerHTML = `
                        <div class="font-bold flex items-center gap-1.5 text-red-800 mb-0.5">
                            <span>❌</span> <span>Scrape Failed</span>
                        </div>
                        <div class="text-[11px] text-red-700">${err.message}</div>
                    `;
                }
            } finally {
                if (submitBtn) submitBtn.disabled = false;
                if (spinner) spinner.classList.add('hidden');
                if (btnText) btnText.textContent = '🚀 Scrape & Sync';
            }
        }

        // Handle Read From Sheet
        async function handleAppLoadFromSheet() {
            const statusBox = document.getElementById('app-scrape-status-box');
            const sheetBtn = document.getElementById('app-load-sheet-btn');
            const sheetSpinner = document.getElementById('app-sheet-spinner');
            const sheetBtnText = document.getElementById('app-sheet-btn-text');

            if (sheetBtn) sheetBtn.disabled = true;
            if (sheetSpinner) sheetSpinner.classList.remove('hidden');
            if (sheetBtnText) sheetBtnText.textContent = 'Loading...';
            if (statusBox) statusBox.className = 'hidden';

            try {
                const requestUrl = `${APPS_SCRIPT_WEB_APP_URL}?action=read`;
                const response = await fetch(requestUrl, { method: 'GET' });
                const result = await response.json();

                if (result.status === 'success') {
                    const d = result.data;
                    if (statusBox) {
                        statusBox.className = 'rounded-2xl p-3.5 text-xs bg-blue-50 text-blue-900 border border-blue-200 shadow-sm block animate-in fade-in duration-200';
                        statusBox.innerHTML = `
                            <div class="font-bold flex items-center gap-1.5 text-blue-800 mb-1">
                                <span>📊</span> <span>Loaded from Google Sheet</span>
                            </div>
                            <div class="text-[11px] text-blue-700">
                                Displaying <strong>${d.openSlots}</strong> slots for <strong>${d.clubName}</strong> (${d.dateStr}).
                            </div>
                        `;
                    }
                    renderAppTeeTimesTable(d.teeTimes, d);
                } else {
                    throw new Error(result.message || 'Could not read sheet data.');
                }
            } catch (err) {
                if (statusBox) {
                    statusBox.className = 'rounded-2xl p-3.5 text-xs bg-red-50 text-red-900 border border-red-200 shadow-sm block animate-in fade-in duration-200';
                    statusBox.innerHTML = `
                        <div class="font-bold flex items-center gap-1.5 text-red-800 mb-0.5">
                            <span>❌</span> <span>Failed to Read Sheet</span>
                        </div>
                        <div class="text-[11px] text-red-700">${err.message}</div>
                    `;
                }
            } finally {
                if (sheetBtn) sheetBtn.disabled = false;
                if (sheetSpinner) sheetSpinner.classList.add('hidden');
                if (sheetBtnText) sheetBtnText.textContent = '📊 View Sheet Data';
            }
        }

            const welcomeUserName = document.getElementById('welcome-user-name');

            if (dateEl) {
                const now = new Date();
                dateEl.textContent = now.toLocaleDateString('en-US', {
                    weekday: 'short',
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric'
                });

            const user = window.Auth ? window.Auth.getUser() : null;

            if (user && user.username) {
                if (valEl) valEl.textContent = `${user.points || 0} Points`;
                if (avatarChar) avatarChar.textContent = user.username.charAt(0).toUpperCase();

                if (avatarChar) avatarChar.textContent = '?';
                if (welcomeContainer) {
                    welcomeContainer.classList.add('hidden');
                    welcomeContainer.classList.remove('flex');

                if (welcomeUserName) {
                    welcomeUserName.textContent = '';

                        </form>

                        <!-- Register Form -->
                        <form id="app-form-register" onsubmit="handleAppRegister(event)" class="hidden space-y-3 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                            <div>
                                <label class="block text-[11px] font-bold text-gray-600 uppercase tracking-wider mb-1">Username</label>
                                <input type="text" id="app-input-reg-user" required placeholder="Choose a username" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#1b4332] bg-gray-50/50">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-gray-600 uppercase tracking-wider mb-1">Email</label>
                                <input type="email" id="app-input-reg-email" required placeholder="golfer@example.com" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#1b4332] bg-gray-50/50">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-gray-600 uppercase tracking-wider mb-1">Password</label>
                                <input type="password" id="app-input-reg-pass" required placeholder="At least 4 characters" minlength="4" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#1b4332] bg-gray-50/50">
                            </div>
                            <button type="submit" id="app-btn-register" class="w-full py-3 bg-[#1b4332] hover:bg-[#143326] text-white rounded-xl text-xs font-bold uppercase tracking-wider shadow-md transition-all active:scale-95">
                                Create Account (0 Points Default)
                            </button>
                        </form>
                    </div>
                `;
            }

            lucide.createIcons();
        }

        function toggleAppAuthMode(mode) {
            const tabLogin = document.getElementById('app-tab-login');
            const tabReg = document.getElementById('app-tab-register');
            const formLogin = document.getElementById('app-form-login');
            const formReg = document.getElementById('app-form-register');
            const alertBox = document.getElementById('app-auth-alert');
            if (alertBox) alertBox.className = 'hidden';

            if (mode === 'register') {
                tabLogin.className = 'flex-1 py-2 text-xs font-bold rounded-xl transition-all text-gray-600';
                tabReg.className = 'flex-1 py-2 text-xs font-bold rounded-xl transition-all bg-white text-gray-900 shadow-sm';
                formLogin.classList.add('hidden');
                formReg.classList.remove('hidden');
            } else {
                tabLogin.className = 'flex-1 py-2 text-xs font-bold rounded-xl transition-all bg-white text-gray-900 shadow-sm';
                tabReg.className = 'flex-1 py-2 text-xs font-bold rounded-xl transition-all text-gray-600';
                formLogin.classList.remove('hidden');
                formReg.classList.add('hidden');
            }
        }

        async function handleAppLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('app-btn-login');
            const userVal = document.getElementById('app-input-login-user').value;
            const passVal = document.getElementById('app-input-login-pass').value;
            const alertBox = document.getElementById('app-auth-alert');

            btn.disabled = true;
            btn.textContent = 'Signing in...';
            if (alertBox) alertBox.className = 'hidden';

            try {
                await window.Auth.login(userVal, passVal);
                renderAccountView();
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Sign In';
                if (alertBox) {
                    alertBox.className = 'p-3 rounded-xl text-xs font-medium bg-red-100 text-red-700 border border-red-200';
                    alertBox.textContent = err.message || 'Login failed';
                }
            }
        }

        async function handleAppRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('app-btn-register');
            const userVal = document.getElementById('app-input-reg-user').value;
            const emailVal = document.getElementById('app-input-reg-email').value;
            const passVal = document.getElementById('app-input-reg-pass').value;
            const alertBox = document.getElementById('app-auth-alert');

            btn.disabled = true;
            btn.textContent = 'Creating Account...';
            if (alertBox) alertBox.className = 'hidden';

            try {
                await window.Auth.register(userVal, emailVal, passVal);
                renderAccountView();
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Create Account (0 Points Default)';
                if (alertBox) {
                    alertBox.className = 'p-3 rounded-xl text-xs font-medium bg-red-100 text-red-700 border border-red-200';
                    alertBox.textContent = err.message || 'Registration failed';
                }
            }
        }

        async function refreshPoints(btn) {
            if (btn) {
                btn.classList.add('animate-spin');
            }
            try {
                await window.Auth.refreshUser();
                renderAccountView();
            } catch (e) {
                console.error(e);
            } finally {
                if (btn) btn.classList.remove('animate-spin');
            }
        }

        function handleAppLogout() {
            if (window.Auth) {
                window.Auth.logout();
            }
            renderAccountView();
        }

        // Event Bindings
        if (reportBtn) {
            reportBtn.addEventListener('click', (e) => {
                e.preventDefault();
                openModal(`
                    <div class="text-center w-full py-2">
                        <div class="w-14 h-14 mx-auto rounded-full bg-amber-100 border-2 border-amber-400 flex items-center justify-center text-amber-600 mb-3 shadow-inner">
                            <i data-lucide="flag" class="w-7 h-7"></i>
                        </div>
                        <h3 class="text-lg font-black text-gray-900">Course Report</h3>
                        <p class="text-xs text-gray-500 mt-1 mb-4 px-2">Report a lost ball, course maintenance issue, or feedback.</p>
                        <div class="space-y-2">
                            <a href="submit.html" class="block w-full py-2.5 bg-[#1b4332] hover:bg-[#143326] text-white rounded-xl text-xs font-bold uppercase tracking-wider transition-colors shadow-md text-center">
                                Open Submission Form
                            </a>
                            <button onclick="closeModal()" class="w-full py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-bold uppercase tracking-wider transition-colors">
                                Cancel
                            </button>
                        </div>
                    </div>
                `);
            });
        }

        function renderScanModal() {
            const user = window.Auth ? window.Auth.getUser() : null;
            if (!user || !user.username) {
                openModal(`
                    <div class="text-center w-full py-2">
                        <div class="w-14 h-14 mx-auto rounded-full bg-amber-100 border-2 border-amber-400 flex items-center justify-center text-amber-700 mb-3 shadow-inner">
                            <i data-lucide="user-x" class="w-7 h-7"></i>
                        </div>
                        <h3 class="text-lg font-black text-gray-900 mb-1">Sign In Required</h3>
                        <p class="text-xs text-gray-500 mb-4 px-2">Please sign in or create an account first so the scanner knows which golfer to award points to!</p>
                        <div class="space-y-2">
                            <button onclick="renderAccountView(); closeModal();" class="w-full py-2.5 bg-[#1b4332] text-white rounded-xl text-xs font-bold uppercase tracking-wider hover:bg-[#143326] transition-colors shadow-md">
                                Sign In / Register
                            </button>
                            <button onclick="closeModal()" class="w-full py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-bold uppercase tracking-wider transition-colors">
                                Close
                            </button>
                        </div>
                    </div>
                `);
                return;
            }

            // Construct payload with user info and timestamp
            const payload = JSON.stringify({
                app: 'multiplayed_golf',
                type: 'golfer_id',
                username: user.username,
                id: user.id || '',
                points: 1
            });

            openModal(`
                <div class="text-center w-full py-1">
                    <h3 class="text-base font-black text-gray-900 mb-3">${user.username}'s Member QR</h3>
                    
                    <div class="bg-white p-3 rounded-2xl shadow-inner border border-gray-200 inline-block mx-auto mb-3">
                        <div id="user-qrcode" class="flex justify-center items-center w-[170px] h-[170px]"></div>
                    </div>

                    <div class="bg-gray-50 rounded-xl p-2 mb-3 border border-gray-100">
                        <p class="text-[11px] text-gray-600 font-medium">Current Balance: <strong class="text-emerald-700 font-black">${user.points || 0} PTS</strong></p>
                    </div>

                    <button onclick="closeModal()" class="w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-bold uppercase tracking-wider transition-colors">
                        Done
                    </button>
                </div>
            `);

            // Generate QR Code into container
            setTimeout(() => {
                const qrContainer = document.getElementById('user-qrcode');
                if (qrContainer) {
                    qrContainer.innerHTML = '';
                    if (typeof QRCode !== 'undefined') {
                        new QRCode(qrContainer, {
                            text: payload,
                            width: 170,
                            height: 170,
                            colorDark: "#0f291e",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.M
                        });
                    } else {
                        // Fallback API if script blocked
                        const img = document.createElement('img');
                        img.src = `https://api.qrserver.com/v1/create-qr-code/?size=170x170&data=${encodeURIComponent(payload)}`;
                        img.alt = 'Member QR Code';
                        img.className = 'w-[170px] h-[170px] rounded-lg';
                        qrContainer.appendChild(img);
                    }
                }
            }, 50);
        }

        if (scanBtn) {
            scanBtn.addEventListener('click', (e) => {
                e.preventDefault();
                renderScanModal();
            });
        }

        if (closeModalBtn) closeModalBtn.addEventListener('click', closeModal);
        if (accountBtn) accountBtn.addEventListener('click', renderAccountView);
        if (homeBtn) homeBtn.addEventListener('click', showHomeView);
        if (coursesBtn) coursesBtn.addEventListener('click', renderCoursesView);

        if (modal) {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
        }

        // Global auth change listener
        window.addEventListener('mpg-auth-change', updateHeaderPoints);
        document.addEventListener('DOMContentLoaded', updateHeaderPoints);
        updateHeaderPoints();
        lucide.createIcons();
    </script>
</body>

</html>
