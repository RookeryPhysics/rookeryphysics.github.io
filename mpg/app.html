<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MULTIPLAYED App</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Righteous&family=Russo+One&family=Kanit:ital,wght@1,900&display=swap" rel="stylesheet">

    <style>
        @keyframes golfBallBounceLeftToRight {
            0% {
                opacity: 0;
                transform: translate3d(-220px, -100px, 0) rotate(-15deg);
                animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53);
            }
            25% {
                opacity: 1;
                transform: translate3d(-130px, 0px, 0) rotate(-8deg);
                animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }
            42% {
                transform: translate3d(-75px, -45px, 0) rotate(-3deg);
                animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53);
            }
            58% {
                transform: translate3d(-35px, 0px, 0) rotate(0deg);
                animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }
            72% {
                transform: translate3d(-16px, -18px, 0) rotate(2deg);
                animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53);
            }
            84% {
                transform: translate3d(-5px, 0px, 0) rotate(0deg);
                animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }
            92% {
                transform: translate3d(-1px, -4px, 0) rotate(1deg);
                animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0) rotate(0deg);
            }
        }

        .multiplayed-title {
            font-family: 'Righteous', 'Russo One', 'Kanit', sans-serif;
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #E6D7B8; /* Light tan */
            text-shadow: 
                -1px -1px 0 #0a2419,  
                 1px -1px 0 #0a2419,
                -1px  1px 0 #0a2419,
                 1px  1px 0 #0a2419,
                 0 2px 5px rgba(0, 0, 0, 0.4);
            display: inline-block;
            transform-origin: bottom center;
            animation: golfBallBounceLeftToRight 1.5s linear both;
            cursor: pointer;
            user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            /* Dark background outside the phone container on desktop */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            overflow: hidden;
        }

        /* Phone container styling to look like a device on desktop */
        #device-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: #f3f4f6;
            position: relative;
            box-shadow: 0 0 0 rgba(0, 0, 0, 0);
        }

        /* Media query to make it look like a phone on larger screens */
        @media (min-width: 480px) {
            #device-container {
                width: 390px;
                /* Standard phone width */
                height: 844px;
                max-height: 90vh;
                /* Standard phone height */
                border-radius: 40px;
                border: 12px solid #0f0f0f;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
                overflow: hidden;
            }
        }

        /* App internal layout */
        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            background-color: #f9fafb;
            overflow: hidden;
        }

        /* Hide scrollbar for cleaner look */
        .scrollable-content::-webkit-scrollbar {
            display: none;
        }

        .scrollable-content {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Custom Floating Action Button styling to match Wendy's 'Order' button */
        .center-nav-item {
            position: relative;
            width: 20%;
            display: flex;
            justify-content: center;
        }

        .floating-btn-wrapper {
            position: absolute;
            top: -28px;
            /* Push it up above the nav bar */
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
        }

        .floating-btn {
            width: 72px;
            height: 72px;
            /* 3D sphere lighting with dimple pattern */
            background-color: #ffffff;
            background-image: 
                radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.2) 35%, rgba(180, 190, 205, 0.6) 80%, rgba(130, 140, 160, 0.9) 100%),
                radial-gradient(#b8c2cc 18%, transparent 22%),
                radial-gradient(#b8c2cc 18%, transparent 22%);
            background-position: 0 0, 0 0, 5px 5px;
            background-size: 100% 100%, 10px 10px, 10px 10px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #1b4332;
            box-shadow: 
                0 10px 18px -3px rgba(0, 0, 0, 0.25),
                0 4px 6px -2px rgba(0, 0, 0, 0.15),
                inset 0 -5px 10px rgba(0, 0, 0, 0.25),
                inset 0 3px 6px rgba(255, 255, 255, 0.9);
            border: 4px solid #ffffff;
            position: relative;
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
        }

        .floating-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 14px 22px -3px rgba(0, 0, 0, 0.28),
                0 6px 8px -2px rgba(0, 0, 0, 0.18),
                inset 0 -5px 10px rgba(0, 0, 0, 0.25),
                inset 0 3px 6px rgba(255, 255, 255, 0.9);
        }

        .floating-btn:active {
            transform: scale(0.94) translateY(1px);
        }

        /* Bottom Nav styling */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            background-color: #ffffff;
            /* Curved top corners to match reference somewhat */
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.05);
            padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 40;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 20%;
            color: #6b7280;
            /* Gray-500 */
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
            gap: 4px;
        }

        .nav-item.active {
            color: #0066cc;
            /* Blue */
        }

        .nav-icon {
            width: 24px;
            height: 24px;
        }
    </style>
</head>

<body>

    <div id="device-container">
        <div class="app-layout">

            <!-- Top Header Area -->
            <header
                class="bg-[#1b4332] text-white px-4 pb-4 pt-6 flex justify-between items-center rounded-b-2xl shadow-sm z-10">
                <!-- Brand Name and Logo -->
                <div class="flex items-center gap-2.5 mt-1">
                    <img src="logo.jpeg" alt="MULTIPLAYED Logo" class="w-10 h-10 rounded-full object-cover border border-white/20 shadow-sm">
                    <div class="flex flex-col">
                        <h1 id="multiplayed-text" class="multiplayed-title" onclick="triggerGolfBounce()" title="Click to bounce!">MULTIPLAYED</h1>
                    </div>
                </div>

                <!-- Points Area -->
                <div
                    class="flex items-center bg-black/10 px-3 py-1.5 rounded-full cursor-pointer hover:bg-black/20 transition-colors">
                    <div class="bg-yellow-400 rounded-full w-4 h-4 flex items-center justify-center mr-1.5 shadow-sm">
                        <span class="text-[#1b4332] text-[10px] font-bold">U</span>
                    </div>
                    <span class="font-bold text-sm tracking-tight">0 Points</span>
                </div>
            </header>

            <!-- Scrollable Main Content -->
            <main id="main-content" class="flex-1 overflow-y-auto scrollable-content pb-32">
                <!-- Main Promo Banner -->
                <div class="p-4">
                    <div class="rounded-xl p-0 overflow-hidden shadow-md relative h-40 flex items-center bg-green-700"
                        style="background-image: url('https://images.unsplash.com/photo-1533460004989-cef01064af7e?auto=format&fit=crop&w=600&q=80'); background-size: cover; background-position: center;">
                        <!-- Dark overlay for text readability -->
                        <div class="absolute inset-0 bg-gradient-to-r from-black/70 to-black/20"></div>

                        <div class="p-5 z-10 w-full relative">
                            <h2 class="text-white text-2xl font-extrabold italic mb-1 leading-tight drop-shadow-md">HIT
                                THE<br>GREENS!</h2>
                            <button
                                class="mt-3 bg-white text-green-700 text-xs font-bold py-1.5 px-4 rounded-full uppercase tracking-wider shadow-sm hover:bg-gray-100 transition-colors">
                                Book Tee Time
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Content Section Header -->
                <div class="px-5 mt-2 flex justify-between items-end">
                    <div>
                        <h3 class="text-[1.35rem] font-bold text-gray-800 tracking-tight">Courses</h3>
                        <p class="text-xs text-gray-500 mt-0.5">Pick up where you left off</p>
                    </div>
                    <a href="#" class="text-[#0066cc] text-sm font-semibold mb-1 hover:underline">View All</a>
                </div>

                <!-- List Items (Mimicking Wendy's offer list) -->
                <div class="mt-4 px-4 space-y-3">

                    <div
                        class="bg-white rounded-xl p-6 shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center">
                        <i data-lucide="map" class="w-10 h-10 text-gray-300 mb-2"></i>
                        <p class="text-sm font-medium text-gray-500">No courses available.</p>
                        <p class="text-xs text-gray-400 mt-1">Check back later for new tee times!</p>
                    </div>

                </div>

                <!-- Extra space at bottom to ensure content isn't hidden by nav bar -->
                <div class="h-8"></div>
            </main>

            <!-- Bottom Navigation Bar based on sketch -->
            <nav class="bottom-nav">
                <!-- Home -->
                <a href="#" id="home-btn" class="nav-item active">
                    <i data-lucide="home" class="nav-icon"></i>
                    <span>Home</span>
                </a>

                <!-- Rewards -->
                <a href="#" id="rewards-btn" class="nav-item hover:text-gray-900 transition-colors">
                    <i data-lucide="award" class="nav-icon"></i>
                    <span>Rewards</span>
                </a>

                <!-- Courses (Center Prominent Button) -->
                <div class="center-nav-item">
                    <div class="floating-btn-wrapper">
                        <button id="courses-btn" class="floating-btn">
                            <i data-lucide="flag-triangle-right" class="w-8 h-8 mb-0.5 text-emerald-800 drop-shadow-[0_1px_1px_rgba(255,255,255,0.8)]"></i>
                            <span class="text-[10px] font-bold text-gray-900 drop-shadow-[0_1px_1px_rgba(255,255,255,0.8)]">Courses</span>
                        </button>
                    </div>
                </div>

                <!-- Scan -->
                <a href="#" id="scan-btn" class="nav-item hover:text-gray-900 transition-colors">
                    <i data-lucide="qr-code" class="nav-icon"></i>
                    <span>Scan</span>
                </a>

                <!-- Account -->
                <a href="#" id="account-btn" class="nav-item hover:text-gray-900 transition-colors">
                    <i data-lucide="user" class="nav-icon"></i>
                    <span>Account</span>
                </a>
            </nav>

            <!-- Modal Overlay -->
            <div id="modal" class="hidden absolute inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity">
                <!-- Empty Modal Container with Close Button -->
                <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl relative min-h-[220px] flex flex-col items-center justify-center border border-gray-100 animate-in fade-in zoom-in-95 duration-200">
                    <button id="close-modal-btn" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 p-1 rounded-full hover:bg-gray-100 transition-colors" aria-label="Close modal">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                    <div id="modal-body" class="w-full flex-1 flex items-center justify-center">
                        <!-- Empty modal content -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Initialize Icons & Animations -->
    <script>
        lucide.createIcons();

        function triggerGolfBounce() {
            const el = document.getElementById('multiplayed-text');
            if (el) {
                el.style.animation = 'none';
                el.offsetHeight; /* trigger reflow */
                el.style.animation = 'golfBallBounceLeftToRight 1.5s linear both';
            }
        }

        // Modal Controls
        const modal = document.getElementById('modal');
        const rewardsBtn = document.getElementById('rewards-btn');
        const scanBtn = document.getElementById('scan-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const accountBtn = document.getElementById('account-btn');
        const homeBtn = document.getElementById('home-btn');
        const coursesBtn = document.getElementById('courses-btn');
        const mainContent = document.getElementById('main-content');

        // Store original home content HTML so user can return to Home if needed
        const homeContentHTML = mainContent ? mainContent.innerHTML : '';

        function openModal(e) {
            if (e) e.preventDefault();
            if (modal) {
                modal.classList.remove('hidden');
            }
        }

        function closeModal(e) {
            if (e) e.preventDefault();
            if (modal) {
                modal.classList.add('hidden');
            }
        }

        function setActiveNav(activeElement) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
                item.classList.remove('active');
            });
            if (activeElement) {
                activeElement.classList.add('active');
            }
        }

        function showHomeView(e) {
            if (e) e.preventDefault();
            if (mainContent && mainContent.innerHTML === '') {
                mainContent.innerHTML = homeContentHTML;
                lucide.createIcons();
            }
            setActiveNav(homeBtn);
        }

        if (rewardsBtn) rewardsBtn.addEventListener('click', openModal);
        if (scanBtn) scanBtn.addEventListener('click', openModal);
        if (closeModalBtn) closeModalBtn.addEventListener('click', closeModal);

        if (accountBtn) {
            accountBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (mainContent) {
                    mainContent.innerHTML = '';
                }
                setActiveNav(accountBtn);
            });
        }

        if (homeBtn) {
            homeBtn.addEventListener('click', showHomeView);
        }

        if (coursesBtn) {
            coursesBtn.addEventListener('click', showHomeView);
        }

        if (modal) {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal();
                }
            });
        }
    </script>
</body>

</html>
