<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MultiPlayed App</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            /* Dark background outside the phone container on desktop */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            overflow: hidden;
        }

        /* Phone container styling to look like a device on desktop */
        #device-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: #f3f4f6;
            position: relative;
            box-shadow: 0 0 0 rgba(0, 0, 0, 0);
        }

        /* Media query to make it look like a phone on larger screens */
        @media (min-width: 480px) {
            #device-container {
                width: 390px;
                /* Standard phone width */
                height: 844px;
                max-height: 90vh;
                /* Standard phone height */
                border-radius: 40px;
                border: 12px solid #0f0f0f;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
                overflow: hidden;
            }
        }

        /* App internal layout */
        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            background-color: #f9fafb;
            overflow: hidden;
        }

        /* Hide scrollbar for cleaner look */
        .scrollable-content::-webkit-scrollbar {
            display: none;
        }

        .scrollable-content {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Custom Floating Action Button styling to match Wendy's 'Order' button */
        .center-nav-item {
            position: relative;
            width: 20%;
            display: flex;
            justify-content: center;
        }

        .floating-btn-wrapper {
            position: absolute;
            top: -28px;
            /* Push it up above the nav bar */
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
        }

        .floating-btn {
            width: 68px;
            height: 68px;
            background-color: #0066cc;
            /* Wendy's blue button color */
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            /* Creating the white cutout effect */
            border: 5px solid #ffffff;
            transition: transform 0.1s;
        }

        .floating-btn:active {
            transform: scale(0.95);
        }

        /* Bottom Nav styling */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            background-color: #ffffff;
            /* Curved top corners to match reference somewhat */
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.05);
            padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 40;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 20%;
            color: #6b7280;
            /* Gray-500 */
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
            gap: 4px;
        }

        .nav-item.active {
            color: #0066cc;
            /* Blue */
        }

        .nav-icon {
            width: 24px;
            height: 24px;
        }
    </style>
</head>

<body>

    <div id="device-container">
        <div class="app-layout">

            <!-- Top Header Area -->
            <header
                class="bg-[#E2231A] text-white px-4 pb-4 pt-6 flex justify-between items-center rounded-b-2xl shadow-sm z-10">
                <!-- Brand Name and Logo -->
                <div class="flex items-center gap-2 mt-1">
                    <img src="logo.jpg" alt="MultiPlayed Logo" class="w-8 h-8 rounded-full object-cover border border-white/20 shadow-sm">
                    <h1 class="text-2xl font-extrabold tracking-tight">MultiPlayed</h1>
                </div>

                <!-- Points Area -->
                <div
                    class="flex items-center bg-black/10 px-3 py-1.5 rounded-full cursor-pointer hover:bg-black/20 transition-colors">
                    <div class="bg-yellow-400 rounded-full w-4 h-4 flex items-center justify-center mr-1.5 shadow-sm">
                        <span class="text-[#E2231A] text-[10px] font-bold">M</span>
                    </div>
                    <span class="font-bold text-sm tracking-tight">0 Points</span>
                </div>
            </header>

            <!-- Scrollable Main Content -->
            <main class="flex-1 overflow-y-auto scrollable-content pb-32">
                <!-- Main Promo Banner -->
                <div class="p-4">
                    <div class="rounded-xl p-0 overflow-hidden shadow-md relative h-40 flex items-center bg-green-700"
                        style="background-image: url('https://images.unsplash.com/photo-1533460004989-cef01064af7e?auto=format&fit=crop&w=600&q=80'); background-size: cover; background-position: center;">
                        <!-- Dark overlay for text readability -->
                        <div class="absolute inset-0 bg-gradient-to-r from-black/70 to-black/20"></div>

                        <div class="p-5 z-10 w-full relative">
                            <h2 class="text-white text-2xl font-extrabold italic mb-1 leading-tight drop-shadow-md">HIT
                                THE<br>GREENS!</h2>
                            <button
                                class="mt-3 bg-white text-green-700 text-xs font-bold py-1.5 px-4 rounded-full uppercase tracking-wider shadow-sm hover:bg-gray-100 transition-colors">
                                Book Tee Time
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Content Section Header -->
                <div class="px-5 mt-2 flex justify-between items-end">
                    <div>
                        <h3 class="text-[1.35rem] font-bold text-gray-800 tracking-tight">Courses</h3>
                        <p class="text-xs text-gray-500 mt-0.5">Pick up where you left off</p>
                    </div>
                    <a href="#" class="text-[#0066cc] text-sm font-semibold mb-1 hover:underline">View All</a>
                </div>

                <!-- List Items (Mimicking Wendy's offer list) -->
                <div class="mt-4 px-4 space-y-3">

                    <div
                        class="bg-white rounded-xl p-6 shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center">
                        <i data-lucide="map" class="w-10 h-10 text-gray-300 mb-2"></i>
                        <p class="text-sm font-medium text-gray-500">No courses available.</p>
                        <p class="text-xs text-gray-400 mt-1">Check back later for new tee times!</p>
                    </div>

                </div>

                <!-- Extra space at bottom to ensure content isn't hidden by nav bar -->
                <div class="h-8"></div>
            </main>

            <!-- Bottom Navigation Bar based on sketch -->
            <nav class="bottom-nav">
                <!-- Home -->
                <a href="#" class="nav-item active">
                    <i data-lucide="home" class="nav-icon"></i>
                    <span>Home</span>
                </a>

                <!-- Rewards -->
                <a href="#" class="nav-item hover:text-gray-900 transition-colors">
                    <i data-lucide="award" class="nav-icon"></i>
                    <span>Rewards</span>
                </a>

                <!-- Courses (Center Prominent Button) -->
                <div class="center-nav-item">
                    <div class="floating-btn-wrapper">
                        <button class="floating-btn">
                            <i data-lucide="flag-triangle-right" class="w-8 h-8 mb-0.5"></i>
                            <span class="text-[10px] font-bold">Courses</span>
                        </button>
                    </div>
                </div>

                <!-- Scan -->
                <a href="#" class="nav-item hover:text-gray-900 transition-colors">
                    <i data-lucide="qr-code" class="nav-icon"></i>
                    <span>Scan</span>
                </a>

                <!-- Account -->
                <a href="#" class="nav-item hover:text-gray-900 transition-colors">
                    <i data-lucide="user" class="nav-icon"></i>
                    <span>Account</span>
                </a>
            </nav>

        </div>
    </div>

    <!-- Initialize Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
