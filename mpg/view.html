<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Submissions - Dashboard</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 32, 54, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #10b981;
            --accent-hover: #059669;
            --accent-glow: rgba(16, 185, 129, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.12);
            --row-hover: rgba(255, 255, 255, 0.03);
            --badge-bg: rgba(16, 185, 129, 0.15);
            --badge-text: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 50% 10%, #1e293b 0%, #0b0f19 80%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Effect */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(16, 185, 129, 0) 70%);
            top: 10%;
            left: 50%;
            transform: translate(-50%, -30%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 1050px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Header Section */
        .header {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.75rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--badge-text);
            background: var(--badge-bg);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.2rem;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            border: none;
            outline: none;
        }

        .btn-refresh {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px 0 var(--accent-glow);
        }

        .btn-refresh:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px 0 rgba(16, 185, 129, 0.35);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border: 1px solid var(--input-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* Controls Bar (Search & Counter) */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-wrapper {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.9rem;
            backdrop-filter: blur(12px);
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 0.95rem;
        }

        .stats-badge {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
        }

        /* Table Card & Container */
        .table-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.92rem;
        }

        thead {
            background: rgba(15, 23, 42, 0.75);
            border-bottom: 1px solid var(--card-border);
        }

        th {
            padding: 1rem 1.25rem;
            font-weight: 600;
            color: #cbd5e1;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            font-size: 0.78rem;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.15s ease;
        }

        tbody tr:hover {
            background: var(--row-hover);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 1.1rem 1.25rem;
            color: #e2e8f0;
            vertical-align: top;
            line-height: 1.5;
        }

        td.date-col {
            color: var(--text-muted);
            font-size: 0.85rem;
            white-space: nowrap;
            width: 190px;
        }

        td.message-col {
            word-break: break-word;
        }

        /* Status States (Loading, Empty, Error) */
        .state-container {
            padding: 4rem 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            color: var(--text-muted);
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(16, 185, 129, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .state-container h3 {
            color: var(--text-main);
            font-size: 1.15rem;
        }

        .state-container p {
            max-width: 480px;
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            margin: 1rem;
            text-align: left;
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .error-box pre {
            margin-top: 0.5rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            overflow-x: auto;
        }
    </style>
</head>

<body>

    <div class="ambient-glow"></div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span class="badge">Live View</span>
                <h1>Golf Submissions Dashboard</h1>
            </div>
            <div class="header-actions">
                <a href="golf-submission.html" class="btn btn-secondary">
                    + New Submission
                </a>
                <button class="btn btn-refresh" id="refreshBtn" onclick="fetchSubmissions()">
                    ↻ Refresh
                </button>
            </div>
        </header>

        <!-- Controls -->
        <div class="controls-bar">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Search entries..."
                    oninput="filterSubmissions()">
            </div>
            <div class="stats-badge" id="statsBadge">Showing 0 entries</div>
        </div>

        <!-- Table Card -->
        <main class="table-card">
            <div id="loadingState" class="state-container">
                <div class="spinner"></div>
                <p>Loading entries from Google Sheets...</p>
            </div>

            <div id="errorState" style="display: none;">
                <div class="error-box" id="errorMessage"></div>
            </div>

            <div id="tableWrapper" class="table-responsive" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 70px;">#</th>
                            <th style="width: 200px;">Date / Time</th>
                            <th>Message</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Data rows will be injected here -->
                    </tbody>
                </table>
            </div>

            <div id="emptyState" class="state-container" style="display: none;">
                <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                    style="opacity: 0.5;">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5m8.25 3.75h3m-3 3h3m-6-3h.008v.008H7.5V11.25zm0 3h.008v.008H7.5V14.25zM3.75 7.5h16.5m-16.5 0A2.25 2.25 0 016 5.25h12a2.25 2.25 0 012.25 2.25" />
                </svg>
                <h3>No Submissions Found</h3>
                <p>There are no entries currently in the sheet or matching your search criteria.</p>
            </div>
        </main>
    </div>

    <script>
        // Google Apps Script Web App URL from golf-submission.html
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyc5bCbITrvxXhPP0xrjGCynWReEAhrT1EttYr5OGj_dtPDmB1dVgOsikCEJhqNW-biBg/exec";

        let allSubmissions = [];

        async function fetchSubmissions(isAutoRefresh = false) {
            const refreshBtn = document.getElementById('refreshBtn');
            const loadingState = document.getElementById('loadingState');
            const errorState = document.getElementById('errorState');
            const tableWrapper = document.getElementById('tableWrapper');
            const emptyState = document.getElementById('emptyState');

            if (!isAutoRefresh) {
                refreshBtn.disabled = true;
                refreshBtn.textContent = 'Refreshing...';
                if (allSubmissions.length === 0) {
                    loadingState.style.display = 'flex';
                    errorState.style.display = 'none';
                    tableWrapper.style.display = 'none';
                    emptyState.style.display = 'none';
                }
            }

            try {
                // Fetch JSON data via GET from the Google Apps Script Web App
                const response = await fetch(SCRIPT_URL, {
                    method: 'GET',
                    redirect: 'follow'
                });

                if (!response.ok) {
                    throw new Error(`Server returned HTTP ${response.status}`);
                }

                const data = await response.json();

                // If data returned is structured as an array of rows or objects
                allSubmissions = Array.isArray(data) ? data : (data.data || data.submissions || []);

                loadingState.style.display = 'none';
                errorState.style.display = 'none';
                
                // Re-apply active search filter if any
                filterSubmissions();

            } catch (err) {
                console.error("Fetch error:", err);
                if (allSubmissions.length === 0) {
                    loadingState.style.display = 'none';
                    errorState.style.display = 'block';

                    const errBox = document.getElementById('errorMessage');
                    errBox.innerHTML = `
                        <strong>⚠️ Could not load data from Google Sheets</strong><br>
                        <p style="margin-top: 0.5rem;">Please ensure your Google Apps Script has a <code>doGet(e)</code> function returning JSON and has been updated with a new deployment.</p>
                        <pre>${err.message}</pre>
                    `;
                }
            } finally {
                if (!isAutoRefresh) {
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = '↻ Refresh';
                }
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return dateStr; // fallback if string isn't standard ISO
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

        function renderTable(items) {
            const tableBody = document.getElementById('tableBody');
            const tableWrapper = document.getElementById('tableWrapper');
            const emptyState = document.getElementById('emptyState');
            const statsBadge = document.getElementById('statsBadge');

            statsBadge.textContent = `Showing ${items.length} ${items.length === 1 ? 'entry' : 'entries'}`;

            if (items.length === 0) {
                tableWrapper.style.display = 'none';
                emptyState.style.display = 'flex';
                return;
            }

            emptyState.style.display = 'none';
            tableWrapper.style.display = 'block';

            tableBody.innerHTML = items.map((item, index) => {
                // Support both object keys (timestamp/message) and row array index [0, 1]
                const timestamp = item.timestamp || item.Timestamp || item.date || item.Date || (Array.isArray(item) ? item[0] : '');
                const message = item.message || item.Message || item.text || item.content || (Array.isArray(item) ? item[1] : (typeof item === 'string' ? item : JSON.stringify(item)));

                return `
                    <tr>
                        <td style="color: var(--text-muted); font-weight: 500;">#${items.length - index}</td>
                        <td class="date-col">${formatDate(timestamp)}</td>
                        <td class="message-col">${escapeHtml(String(message))}</td>
                    </tr>
                `;
            }).join('');
        }

        function filterSubmissions() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                renderTable(allSubmissions);
                return;
            }

            const filtered = allSubmissions.filter(item => {
                const timestamp = String(item.timestamp || item.Timestamp || (Array.isArray(item) ? item[0] : '')).toLowerCase();
                const message = String(item.message || item.Message || (Array.isArray(item) ? item[1] : item)).toLowerCase();
                return timestamp.includes(query) || message.includes(query);
            });

            renderTable(filtered);
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Initial load on page start and set 10s auto-refresh
        document.addEventListener('DOMContentLoaded', () => {
            fetchSubmissions();
            setInterval(() => {
                fetchSubmissions(true);
            }, 10000);
        });
    </script>
</body>

</html>
