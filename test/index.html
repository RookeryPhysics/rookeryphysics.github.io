<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Green Plane</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        p {
            margin: 0;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>Three.js Environment</h1>
        <p>Large green plane. Camera placed at eye level (y = 1.6).</p>
    </div>

    <!-- Include Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a2636); // Sleek dark blue sky/background
        scene.fog = new THREE.FogExp2(0x1a2636, 0.015);

        // 2. Camera Setup (Eye level at 1.6 units above the plane)
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);

        // 3. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 4. Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.01; // Don't go below ground
        controls.minDistance = 1;
        controls.maxDistance = 100;
        controls.target.set(0, 1.6, 0);

        // 5. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 100;
        const d = 50;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // 6. Ground Plane (Large Green Plane)
        const planeSize = 1000;
        const planeGeo = new THREE.PlaneGeometry(planeSize, planeSize);
        // Premium looking green material with slight roughness
        const planeMat = new THREE.MeshStandardMaterial({ 
            color: 0x2e7d32, 
            roughness: 0.8,
            metalness: 0.2
        });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        // Add a subtle grid helper to show scale and perspective
        const gridHelper = new THREE.GridHelper(1000, 200, 0x4caf50, 0x388e3c);
        gridHelper.position.y = 0.01; // slightly above plane to avoid z-fighting
        scene.add(gridHelper);

        // Add some simple marker elements to give depth
        const markerGeo = new THREE.BoxGeometry(1, 2, 1);
        const markerMat = new THREE.MeshStandardMaterial({ color: 0x1565c0, roughness: 0.5 });
        for (let i = 0; i < 5; i++) {
            const marker = new THREE.Mesh(markerGeo, markerMat);
            marker.position.set((Math.random() - 0.5) * 50, 1, -(Math.random() * 50 + 10));
            marker.castShadow = true;
            marker.receiveShadow = true;
            scene.add(marker);
        }

        // 7. Handle Window Resize
        window.addEventListener('resize', onWindowResize, false);

        // 8. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
