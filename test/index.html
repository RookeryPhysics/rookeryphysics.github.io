<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>aquaLog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-base: #08131a;
            --bg-card: rgba(14, 34, 46, 0.75);
            --bg-card-border: rgba(6, 182, 212, 0.18);
            --accent: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.45);
            --accent-hover: #0891b2;
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.3);
            --text-main: #f0fdfa;
            --text-sub: #7dd3fc;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image:
                radial-gradient(circle at 15% 10%, rgba(6, 182, 212, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(20, 184, 166, 0.16) 0%, transparent 45%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 120px;
        }

        header {
            width: 100%;
            max-width: 600px;
            padding: 24px 20px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            background: rgba(11, 15, 25, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header-title-wrap h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 30%, #67e8f9 70%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title-wrap p {
            font-size: 0.78rem;
            color: var(--text-sub);
            margin-top: 2px;
        }


        main {
            width: 100%;
            max-width: 600px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Job Number Bar */
        .job-number-bar {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius-lg);
            padding: 12px 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .job-number-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-sub);
            white-space: nowrap;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            min-width: 95px;
        }

        .job-input-field {
            flex: 1;
            background: rgba(10, 25, 36, 0.7);
            border: 1px solid rgba(6, 182, 212, 0.2);
            color: #fff;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .job-input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.25);
        }

        /* Quick Unit Adder */
        .add-unit-bar {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius-lg);
            padding: 12px 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            display: flex;
            gap: 10px;
        }

        .unit-input-field {
            flex: 1;
            background: rgba(10, 25, 36, 0.7);
            border: 1px solid rgba(6, 182, 212, 0.2);
            color: #fff;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .unit-input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.25);
        }

        .btn-add-unit {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            padding: 0 18px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--accent-glow);
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .btn-add-unit:active {
            transform: scale(0.96);
        }

        /* Units List */
        .units-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-sub);
            background: rgba(22, 30, 49, 0.35);
            border: 1px dashed rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-lg);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
            stroke: var(--text-sub);
        }

        .unit-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .unit-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .unit-name-input {
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            padding: 4px 8px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .unit-name-input:focus {
            background: rgba(10, 25, 36, 0.6);
            border-color: rgba(6, 182, 212, 0.45);
        }

        .btn-delete-unit {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 6px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-delete-unit:hover,
        .btn-delete-unit:active {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        /* Unit Plus Action Bar */
        .unit-actions-row {
            display: flex;
            gap: 10px;
        }

        .btn-capture {
            flex: 1;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.16) 0%, rgba(20, 184, 166, 0.12) 100%);
            border: 1px dashed rgba(6, 182, 212, 0.55);
            color: #67e8f9;
            border-radius: var(--radius-md);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-capture:hover {
            background: rgba(6, 182, 212, 0.25);
            border-color: #22d3ee;
            color: #fff;
            box-shadow: 0 0 16px rgba(6, 182, 212, 0.25);
        }

        .btn-capture:active {
            transform: scale(0.98);
        }

        .btn-capture svg {
            stroke-width: 2.5;
        }

        /* Gallery Grid */
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 4px;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s ease;
        }

        .gallery-item:active img {
            transform: scale(1.06);
        }

        .gallery-del-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            z-index: 5;
        }

        /* Bottom Fixed Action Bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            z-index: 30;
        }

        .bottom-bar-inner {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 12px;
        }

        .btn-export {
            flex: 1;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            color: #fff;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.35);
            transition: all 0.2s ease;
        }

        .btn-export:active {
            transform: scale(0.97);
        }

        .btn-clear {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-clear:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        /* Modal Preview */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 92vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: var(--radius-md);
            object-fit: contain;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .modal-close {
            position: absolute;
            top: -42px;
            right: 0;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hidden inputs */
        .hidden-file-input {
            display: none;
        }
    </style>
</head>

<body>

    <header>
        <div class="header-title-wrap">
            <h1>aquaLog</h1>
        </div>
    </header>

    <main>
        <!-- Job Number Input -->
        <section class="job-number-bar">
            <span class="job-number-label">Job Number</span>
            <input type="text" id="jobNumberInput" class="job-input-field" placeholder="Enter job # (e.g. 26XX123)"
                autocomplete="off">
        </section>

        <!-- Address Input -->
        <section class="job-number-bar">
            <span class="job-number-label">Address</span>
            <input type="text" id="addressInput" class="job-input-field" placeholder="Enter address (e.g. 123 Main St)"
                autocomplete="off">
        </section>

        <!-- Unit Name Quick Input -->
        <section class="add-unit-bar">
            <input type="text" id="newUnitInput" class="unit-input-field"
                placeholder="Enter unit name (e.g. Unit 101, Roof, Kitchen)" autocomplete="off">
            <button class="btn-add-unit" id="btnAddUnit" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Add</span>
            </button>
        </section>

        <!-- Unit Cards List -->
        <section id="unitsList" class="units-container">
            <!-- Dynamically populated or empty state -->
        </section>
    </main>

    <!-- Bottom Navigation & Action Bar -->
    <nav class="bottom-bar">
        <div class="bottom-bar-inner">
            <button class="btn-export" id="btnExportEml" type="button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <span>Export as .eml</span>
            </button>
            <button class="btn-clear" id="btnClearAll" title="Clear Session" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Lightbox Modal -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <img id="modalImg" src="" alt="Preview">
        </div>
    </div>

    <!-- Hidden File Input for Mobile Camera / Upload -->
    <input type="file" id="cameraInput" class="hidden-file-input" accept="image/*" capture="environment" multiple>

    <script>
        (function () {
            const DB_NAME = 'aquaLogDB';
            const DB_VERSION = 1;
            const STORE_NAME = 'app_state';
            const STATE_KEY = 'current_session';

            let units = [];
            let jobNumber = '';
            let address = '';
            let activeTargetUnitId = null;

            const jobNumberInput = document.getElementById('jobNumberInput');
            const addressInput = document.getElementById('addressInput');

            let dbPromise = null;
            function getDB() {
                if (!dbPromise) {
                    dbPromise = new Promise((resolve, reject) => {
                        const request = indexedDB.open(DB_NAME, DB_VERSION);
                        request.onupgradeneeded = (event) => {
                            const db = event.target.result;
                            if (!db.objectStoreNames.contains(STORE_NAME)) {
                                db.createObjectStore(STORE_NAME);
                            }
                        };
                        request.onsuccess = (event) => resolve(event.target.result);
                        request.onerror = (event) => reject(event.target.error);
                    });
                }
                return dbPromise;
            }

            async function loadState() {
                try {
                    const db = await getDB();
                    const state = await new Promise((resolve, reject) => {
                        const tx = db.transaction(STORE_NAME, 'readonly');
                        const store = tx.objectStore(STORE_NAME);
                        const req = store.get(STATE_KEY);
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });

                    if (state) {
                        jobNumber = state.jobNumber || '';
                        address = state.address || '';
                        if (jobNumberInput) {
                            jobNumberInput.value = jobNumber;
                        }
                        if (addressInput) {
                            addressInput.value = address;
                        }
                        units = state.units || [];
                    } else {
                        // Check if data exists in the previous WaterLoggerDB before rename
                        let legacyDbState = null;
                        try {
                            const oldDb = await new Promise((res, rej) => {
                                const req = indexedDB.open('WaterLoggerDB', 1);
                                req.onsuccess = () => res(req.result);
                                req.onerror = () => rej(req.error);
                            });
                            if (oldDb.objectStoreNames.contains('app_state')) {
                                legacyDbState = await new Promise((res) => {
                                    const tx = oldDb.transaction('app_state', 'readonly');
                                    const r = tx.objectStore('app_state').get(STATE_KEY);
                                    r.onsuccess = () => res(r.result);
                                    r.onerror = () => res(null);
                                });
                            }
                        } catch (err) {
                            // Ignored if WaterLoggerDB doesn't exist
                        }

                        if (legacyDbState) {
                            jobNumber = legacyDbState.jobNumber || '';
                            if (jobNumberInput) jobNumberInput.value = jobNumber;
                            units = legacyDbState.units || [];
                            saveState();
                        } else {
                            // Check for backwards compatibility with any existing sessionStorage
                            const legacyJob = sessionStorage.getItem('unit_photo_collector_job_number');
                            const legacyUnits = sessionStorage.getItem('unit_photo_collector_session_v1');
                            if (legacyJob !== null || legacyUnits !== null) {
                                jobNumber = legacyJob || '';
                                if (jobNumberInput) jobNumberInput.value = jobNumber;
                                units = legacyUnits ? JSON.parse(legacyUnits) : [];
                                saveState();
                            } else {
                                // Default starting sample unit
                                units = [{
                                    id: generateId(),
                                    name: "Unit 1",
                                    images: []
                                }];
                            }
                        }
                    }
                } catch (e) {
                    console.error("Error loading state from IndexedDB", e);
                    units = [{
                        id: generateId(),
                        name: "Unit 1",
                        images: []
                    }];
                }
                render();
            }

            async function saveState() {
                try {
                    const db = await getDB();
                    await new Promise((resolve, reject) => {
                        const tx = db.transaction(STORE_NAME, 'readwrite');
                        const store = tx.objectStore(STORE_NAME);
                        const req = store.put({ jobNumber: jobNumber, address: address, units: units }, STATE_KEY);
                        req.onsuccess = () => resolve();
                        req.onerror = () => reject(req.error);
                    });
                } catch (e) {
                    console.error("Error saving state to IndexedDB", e);
                }
            }

            function generateId() {
                return 'unit_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            // Render units UI
            function render() {
                const container = document.getElementById('unitsList');
                container.innerHTML = '';

                if (units.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke-width="1.5"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5" stroke-width="1.5"></circle>
                                <polyline points="21 15 16 10 5 21" stroke-width="1.5"></polyline>
                            </svg>
                            <p style="font-weight: 500;">No units added yet.</p>
                            <p style="font-size: 0.8rem; margin-top: 4px;">Enter a unit name above to start taking photos.</p>
                        </div>
                    `;
                    return;
                }

                units.forEach((unit) => {
                    const card = document.createElement('article');
                    card.className = 'unit-card';
                    card.dataset.unitId = unit.id;

                    // Unit Header (Title + Delete button)
                    const header = document.createElement('div');
                    header.className = 'unit-header';

                    const nameInput = document.createElement('input');
                    nameInput.type = 'text';
                    nameInput.className = 'unit-name-input';
                    nameInput.value = unit.name;
                    nameInput.placeholder = 'Unit name...';
                    nameInput.addEventListener('change', (e) => {
                        unit.name = e.target.value.trim() || 'Untitled Unit';
                        saveState();
                    });

                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-delete-unit';
                    delBtn.title = 'Remove Unit';
                    delBtn.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    `;
                    delBtn.addEventListener('click', () => {
                        if (confirm(`Delete "${unit.name}" and its photos?`)) {
                            units = units.filter(u => u.id !== unit.id);
                            saveState();
                            render();
                        }
                    });

                    header.appendChild(nameInput);
                    header.appendChild(delBtn);

                    // Plus Button Action Row (Below unit name)
                    const actionRow = document.createElement('div');
                    actionRow.className = 'unit-actions-row';

                    const addPhotoBtn = document.createElement('button');
                    addPhotoBtn.className = 'btn-capture';
                    addPhotoBtn.type = 'button';
                    addPhotoBtn.innerHTML = `
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add Photo (Camera)</span>
                    `;
                    addPhotoBtn.addEventListener('click', () => {
                        activeTargetUnitId = unit.id;
                        const fileInput = document.getElementById('cameraInput');
                        fileInput.value = '';
                        fileInput.click();
                    });

                    actionRow.appendChild(addPhotoBtn);

                    // Photos Gallery
                    const gallery = document.createElement('div');
                    gallery.className = 'photo-gallery';

                    if (unit.images && unit.images.length > 0) {
                        unit.images.forEach((imgData, imgIdx) => {
                            const item = document.createElement('div');
                            item.className = 'gallery-item';

                            const imgEl = document.createElement('img');
                            imgEl.src = imgData.dataUrl;
                            imgEl.alt = `${unit.name} photo ${imgIdx + 1}`;
                            imgEl.loading = 'lazy';
                            imgEl.addEventListener('click', () => {
                                showModal(imgData.dataUrl);
                            });

                            const removeImgBtn = document.createElement('button');
                            removeImgBtn.className = 'gallery-del-btn';
                            removeImgBtn.innerHTML = '&times;';
                            removeImgBtn.title = 'Delete photo';
                            removeImgBtn.addEventListener('click', (e) => {
                                e.stopPropagation();
                                unit.images.splice(imgIdx, 1);
                                saveState();
                                render();
                            });

                            item.appendChild(imgEl);
                            item.appendChild(removeImgBtn);
                            gallery.appendChild(item);
                        });
                    }

                    card.appendChild(header);
                    card.appendChild(actionRow);
                    if (unit.images && unit.images.length > 0) {
                        card.appendChild(gallery);
                    }

                    container.appendChild(card);
                });
            }

            // Image Compression & Conversion to Data URL
            function processImageFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const img = new Image();
                        img.onload = function () {
                            // Max dimensions to ensure efficient browser session storage and email attachment sizing
                            const maxDimension = 1400;
                            let width = img.width;
                            let height = img.height;

                            if (width > maxDimension || height > maxDimension) {
                                if (width > height) {
                                    height = Math.round((height * maxDimension) / width);
                                    width = maxDimension;
                                } else {
                                    width = Math.round((width * maxDimension) / height);
                                    height = maxDimension;
                                }
                            }

                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);
                            resolve({
                                name: file.name || `photo_${Date.now()}.jpg`,
                                mimeType: 'image/jpeg',
                                dataUrl: compressedDataUrl,
                                timestamp: new Date().toISOString()
                            });
                        };
                        img.onerror = () => reject(new Error('Failed to load image'));
                        img.src = e.target.result;
                    };
                    reader.onerror = () => reject(new Error('Failed to read file'));
                    reader.readAsDataURL(file);
                });
            }

            // Camera file input change
            document.getElementById('cameraInput').addEventListener('change', async function (e) {
                if (!activeTargetUnitId || !e.target.files || e.target.files.length === 0) return;

                const targetUnit = units.find(u => u.id === activeTargetUnitId);
                if (!targetUnit) return;

                const files = Array.from(e.target.files);
                for (const file of files) {
                    try {
                        const imgObj = await processImageFile(file);
                        if (!targetUnit.images) targetUnit.images = [];
                        targetUnit.images.push(imgObj);
                    } catch (err) {
                        console.error('Error handling image', err);
                        alert('Could not process selected image: ' + err.message);
                    }
                }

                saveState();
                render();
            });

            // Job Number input listener
            if (jobNumberInput) {
                jobNumberInput.addEventListener('input', (e) => {
                    jobNumber = e.target.value.trim();
                    saveState();
                });
            }

            // Add Unit button handler
            function addNewUnit() {
                const input = document.getElementById('newUnitInput');
                const name = input.value.trim();
                if (!name) {
                    input.focus();
                    return;
                }

                units.push({
                    id: generateId(),
                    name: name,
                    images: []
                });

                input.value = '';
                saveState();
                render();

                // Scroll smoothly to the bottom
                setTimeout(() => {
                    window.scrollTo({
                        top: document.body.scrollHeight,
                        behavior: 'smooth'
                    });
                }, 100);
            }

            document.getElementById('btnAddUnit').addEventListener('click', addNewUnit);
            document.getElementById('newUnitInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addNewUnit();
                }
            });

            // Clear All Button
            document.getElementById('btnClearAll').addEventListener('click', async () => {
                if (confirm("Reset and clear all units and photos from storage?")) {
                    units = [];
                    jobNumber = '';
                    if (jobNumberInput) {
                        jobNumberInput.value = '';
                    }
                    try {
                        const db = await getDB();
                        const tx = db.transaction(STORE_NAME, 'readwrite');
                        tx.objectStore(STORE_NAME).delete(STATE_KEY);
                    } catch (e) {
                        console.error('Failed to clear database', e);
                    }
                    sessionStorage.removeItem('unit_photo_collector_session_v1');
                    sessionStorage.removeItem('unit_photo_collector_job_number');
                    render();
                }
            });

            // Lightbox Modal functions
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            function showModal(src) {
                modalImg.src = src;
                modal.classList.add('active');
            }
            function closeModal() {
                modal.classList.remove('active');
                modalImg.src = '';
            }
            document.getElementById('modalClose').addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            // Generate .eml file content with RFC 2822 / MIME multipart format
            function generateEmlContent() {
                const boundary = "----=_Part_" + Math.random().toString(36).substring(2) + "_" + Date.now();
                const now = new Date();
                const dateStr = now.toUTCString();

                const cleanJobNumber = (jobNumber || '').trim();
                const photosTag = cleanJobNumber ? `***PHOTOS*** ${cleanJobNumber}` : `***PHOTOS***`;

                let eml = "";
                // Standard Headers with ***PHOTOS*** in Subject and Custom Header
                eml += `To: floodoffice@pheonixrestorations.com\r\n`;
                eml += `Date: ${dateStr}\r\n`;
                eml += `Subject: ${photosTag}\r\n`;
                eml += `X-Header: ${photosTag}\r\n`;
                eml += `MIME-Version: 1.0\r\n`;
                eml += `Content-Type: multipart/mixed; boundary="${boundary}"\r\n`;
                eml += `\r\n`;

                // Email Body Section (HTML and Summary)
                eml += `--${boundary}\r\n`;
                eml += `Content-Type: text/html; charset=UTF-8\r\n`;
                eml += `Content-Transfer-Encoding: 7bit\r\n`;
                eml += `\r\n`;

                // Build HTML body
                let bodyHtml = `<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f9fafb; color: #111827; padding: 24px; }
    .container { max-width: 650px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 24px; border: 1px solid #e5e7eb; }
    h1 { color: #0e7490; margin-top: 0; font-size: 24px; border-bottom: 2px solid #06b6d4; padding-bottom: 8px; }
    .unit-section { margin-top: 24px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; background: #f8fafc; }
    .unit-title { font-size: 18px; font-weight: bold; color: #1e293b; margin-bottom: 8px; }
    .photo-count { font-size: 13px; color: #64748b; margin-bottom: 12px; }
    ul { margin: 8px 0; padding-left: 20px; }
    li { margin-bottom: 4px; font-size: 14px; color: #334155; }
    .footer { margin-top: 30px; font-size: 12px; color: #94a3b8; text-align: center; }
</style>
</head>
<body>
<div class="container">
    <h1>${escapeHtml(photosTag)}</h1>
    <p>Export generated on <strong>${now.toLocaleString()}</strong></p>
`;

                let attachments = [];
                let totalPhotos = 0;

                units.forEach((unit, uIdx) => {
                    const unitName = unit.name || `Unit ${uIdx + 1}`;
                    const imgList = unit.images || [];
                    totalPhotos += imgList.length;

                    bodyHtml += `
    <div class="unit-section">
        <div class="unit-title">📍 ${escapeHtml(unitName)}</div>
        <div class="photo-count">${imgList.length} photo(s) attached</div>
        <ul>
`;

                    imgList.forEach((img, iIdx) => {
                        const safeUnitName = unitName.replace(/[^a-zA-Z0-9_-]/g, '_');
                        const filename = `${safeUnitName}_photo_${iIdx + 1}.jpg`;
                        bodyHtml += `            <li>${filename}</li>\r\n`;

                        // Parse base64
                        const base64Data = img.dataUrl.split(',')[1] || '';
                        attachments.push({
                            filename: filename,
                            mimeType: img.mimeType || 'image/jpeg',
                            base64: base64Data
                        });
                    });

                    bodyHtml += `        </ul>
    </div>
`;
                });

                bodyHtml += `
    <div class="footer">
        Generated by Mobile Unit Photo Collector
    </div>
</div>
</body>
</html>
`;

                eml += bodyHtml;
                eml += `\r\n\r\n`;

                // Attachments
                attachments.forEach(att => {
                    eml += `--${boundary}\r\n`;
                    eml += `Content-Type: ${att.mimeType}; name="${att.filename}"\r\n`;
                    eml += `Content-Disposition: attachment; filename="${att.filename}"\r\n`;
                    eml += `Content-Transfer-Encoding: base64\r\n`;
                    eml += `\r\n`;

                    // Break base64 string into 76-character chunks as per RFC standards
                    const formattedBase64 = att.base64.match(/.{1,76}/g)?.join('\r\n') || att.base64;
                    eml += formattedBase64;
                    eml += `\r\n\r\n`;
                });

                eml += `--${boundary}--\r\n`;
                return eml;
            }

            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            // Export button handler
            document.getElementById('btnExportEml').addEventListener('click', () => {
                if (units.length === 0) {
                    alert('Please add at least one unit before exporting.');
                    return;
                }

                let totalPhotos = 0;
                units.forEach(u => totalPhotos += (u.images ? u.images.length : 0));

                if (totalPhotos === 0) {
                    if (!confirm('No photos have been taken yet. Do you still want to export the unit list as .eml?')) {
                        return;
                    }
                }

                try {
                    const emlString = generateEmlContent();
                    const blob = new Blob([emlString], { type: 'message/rfc822' });
                    const downloadUrl = URL.createObjectURL(blob);

                    const now = new Date();
                    const dateTag = now.toISOString().slice(0, 10);
                    const filename = `PHOTOS_Units_${dateTag}.eml`;

                    const link = document.createElement('a');
                    link.href = downloadUrl;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(downloadUrl);
                } catch (e) {
                    console.error('Failed to export eml', e);
                    alert('Export failed: ' + e.message);
                }
            });

            // Initialize app
            loadState();
        })();
    </script>
</body>

</html>
