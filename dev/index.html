<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Three.js Engine Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --app-height: 100dvh;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      min-height: 100%;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background-color: #090c12;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .app-viewport {
      height: 100%;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      max-height: 100dvh;
      max-height: var(--app-height, 100dvh);
    }

    .chat-footer {
      padding-bottom: max(0.6rem, env(safe-area-inset-bottom, 0.6rem));
      padding-left: max(0.75rem, env(safe-area-inset-left, 0.75rem));
      padding-right: max(0.75rem, env(safe-area-inset-right, 0.75rem));
    }

    #canvas-container {
      position: relative;
      width: 100%;
      height: 100%;
      flex: 1;
      min-height: 0;
      outline: none;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(13, 17, 26, 0.8);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.3);
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.55);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="select-none text-slate-200 flex flex-col app-viewport w-screen overflow-hidden bg-[#090c12]">
  
  <!-- Ambient line -->
  <div class="h-[2px] w-full bg-gradient-to-r from-indigo-500 via-indigo-400 to-indigo-600 shrink-0 opacity-80"></div>

  <!-- Top App Header -->
  <header class="h-14 px-3 sm:px-4 shrink-0 bg-[#0f131c]/95 backdrop-blur-md border-b border-slate-800/80 flex items-center justify-between z-20">
    
    <!-- Top Left: App Mark & Export -->
    <div class="flex items-center gap-2.5 sm:gap-3">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-sm shadow-indigo-600/30">
          <i class="fa-solid fa-cube text-xs"></i>
        </div>
        <span class="font-bold text-xs sm:text-sm tracking-tight text-white hidden xs:inline">Engine<span class="text-indigo-400">Lab</span></span>
      </div>

      <div class="h-4 w-px bg-slate-800 hidden sm:block"></div>

      <!-- Export Button -->
      <button id="export-standalone-btn" title="Export clean standalone .html game"
        class="h-8 px-2.5 sm:px-3 rounded-lg bg-slate-900/80 hover:bg-slate-800 text-slate-200 hover:text-white border border-slate-800 hover:border-slate-700 active:scale-95 text-xs font-medium transition flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-file-arrow-down text-slate-400 text-xs"></i>
        <span>Export</span>
      </button>
    </div>

    <!-- Top Right: Undo/Redo & History Drawer Trigger -->
    <div class="flex items-center gap-1.5">
      <button id="quick-undo-btn" title="Revert to previous version (Ctrl+Z)"
        class="h-8 w-8 rounded-lg flex items-center justify-center bg-slate-900/80 text-slate-300 hover:text-white hover:bg-slate-800 active:scale-95 disabled:opacity-30 disabled:pointer-events-none transition border border-slate-800 hover:border-slate-700">
        <i class="fa-solid fa-arrow-rotate-left text-xs"></i>
      </button>

      <button id="quick-redo-btn" title="Forward to next version (Ctrl+Y)"
        class="h-8 w-8 rounded-lg flex items-center justify-center bg-slate-900/80 text-slate-300 hover:text-white hover:bg-slate-800 active:scale-95 disabled:opacity-30 disabled:pointer-events-none transition border border-slate-800 hover:border-slate-700">
        <i class="fa-solid fa-arrow-rotate-right text-xs"></i>
      </button>

      <div class="w-px h-4 bg-slate-800 mx-0.5"></div>

      <button id="toggle-history-btn"
        class="h-8 px-2.5 sm:px-3 rounded-lg bg-slate-900/80 hover:bg-slate-800 text-slate-200 hover:text-white border border-slate-800 hover:border-slate-700 active:scale-95 text-xs font-medium transition flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-clock-rotate-left text-indigo-400 text-xs"></i>
        <span>History</span>
        <span id="version-count-badge"
          class="ml-0.5 px-1.5 py-0.2 bg-indigo-600/80 text-indigo-100 font-mono text-[10px] font-semibold rounded">1</span>
      </button>
    </div>
  </header>

  <!-- Dedicated Game Canvas Viewport -->
  <main id="canvas-container" class="relative flex-1 w-full h-full min-h-0 bg-[#0c1017]"></main>

  <!-- Bottom Workspace Toolbar & Prompt Dock -->
  <footer class="chat-footer shrink-0 bg-[#0f131c]/95 backdrop-blur-md border-t border-slate-800/80 py-2.5 z-20">
    <div class="max-w-3xl mx-auto">
      <div class="flex items-center gap-2 bg-[#131824] border border-slate-800 rounded-xl p-1.5 transition-all focus-within:border-indigo-500/70 focus-within:ring-2 focus-within:ring-indigo-500/20 shadow-lg">

        <!-- Status Indicator Pill -->
        <div id="status-badge" class="flex items-center gap-1.5 h-7 px-2.5 rounded-lg bg-emerald-500/10 border border-emerald-500/25 text-emerald-300 text-[10px] font-mono font-medium shrink-0" title="Engine Status">
          <div id="status-indicator" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></div>
          <span id="status-text" class="hidden sm:inline">Ready</span>
        </div>

        <input id="prompt-input" type="text" placeholder="Describe changes..."
          class="flex-1 bg-transparent px-2.5 py-1 text-xs sm:text-sm text-slate-100 placeholder-slate-500 focus:outline-none"
          autocomplete="off" />

        <button id="submit-btn"
          class="h-7 shrink-0 flex items-center justify-center gap-1.5 px-3 sm:px-3.5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs font-semibold rounded-lg transition duration-150 shadow-sm disabled:opacity-40 disabled:pointer-events-none">
          <span id="btn-text">Apply</span>
          <svg id="btn-spinner" class="hidden animate-spin h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
        </button>
      </div>
    </div>
  </footer>

  <!-- Slide-out History Drawer -->
  <div id="history-backdrop"
    class="fixed inset-0 bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200 z-40">
  </div>

  <aside id="history-drawer"
    class="fixed top-0 right-0 h-full w-full max-w-md bg-[#0f131c]/98 backdrop-blur-2xl border-l border-slate-800 shadow-2xl z-50 transform translate-x-full transition-transform duration-250 ease-out flex flex-col">
    
    <!-- History Drawer Header -->
    <div class="h-14 px-4 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 text-xs">
          <i class="fa-solid fa-clock-rotate-left"></i>
        </div>
        <div>
          <h2 class="text-sm font-semibold text-white tracking-tight">History</h2>
          <p class="text-[11px] text-slate-400">Revert or inspect previous engine states</p>
        </div>
      </div>
      <button id="close-history-btn"
        class="w-8 h-8 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/80 flex items-center justify-center transition border border-transparent hover:border-slate-800">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
    </div>

    <!-- History Drawer Toolbar -->
    <div class="px-4 py-2 bg-[#0a0d14] border-b border-slate-800/80 flex items-center justify-between text-xs">
      <span id="history-summary" class="text-slate-400 font-mono text-[11px]">1 version saved</span>
      <div class="flex items-center gap-2">
        <button id="export-history-btn"
          class="h-6 text-[11px] text-slate-300 hover:text-white font-medium transition flex items-center gap-1.5 px-2 rounded-lg bg-slate-900 border border-slate-800 hover:border-slate-700">
          <i class="fa-solid fa-file-arrow-down text-[10px] text-slate-400"></i> Export Log (JSON)
        </button>
      </div>
    </div>

    <!-- History List Container -->
    <div id="timeline-list" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
  </aside>

  <!-- Code & Reasoning Viewer Modal -->
  <div id="code-modal"
    class="fixed inset-0 bg-black/70 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-200 z-50 flex items-center justify-center p-4">
    <div
      class="bg-[#111520] border border-slate-800 rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      
      <div class="p-3.5 bg-[#0e121a] border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1.5 bg-slate-900 border border-slate-800 rounded-lg p-0.5 text-xs">
            <button id="tab-code-btn" class="px-2.5 py-1 rounded bg-indigo-600 text-white font-medium transition">
              <i class="fa-solid fa-code text-[10px] mr-1"></i> Code
            </button>
            <button id="tab-reasoning-btn" class="px-2.5 py-1 rounded text-slate-400 hover:text-slate-200 font-medium transition">
              <i class="fa-solid fa-brain text-[10px] mr-1"></i> Reasoning
            </button>
          </div>
          <span id="modal-code-title" class="text-xs font-semibold text-slate-300 font-mono truncate max-w-[200px] sm:max-w-xs">Version Info</span>
        </div>

        <div class="flex items-center gap-2">
          <button id="copy-code-btn"
            class="h-7 px-2.5 text-[11px] rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-200 hover:text-white border border-slate-800 transition flex items-center gap-1.5 font-medium">
            <i class="fa-regular fa-copy text-[10px] text-slate-400"></i> Copy
          </button>
          <button id="close-code-modal-btn"
            class="w-7 h-7 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition border border-transparent hover:border-slate-800">
            <i class="fa-solid fa-xmark text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Tab Contents -->
      <div class="flex-1 overflow-auto p-4 bg-[#090c12] font-mono text-xs text-slate-200 leading-relaxed whitespace-pre"
        id="modal-code-content"></div>
      <div class="hidden flex-1 overflow-auto p-4 bg-[#090c12] text-xs text-slate-300 leading-relaxed whitespace-pre-wrap font-sans"
        id="modal-reasoning-content"></div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast"
    class="fixed top-4 left-1/2 -translate-x-1/2 px-3.5 py-1.5 rounded-xl text-xs backdrop-blur-md transition-opacity duration-200 pointer-events-none opacity-0 z-50 shadow-xl font-medium border">
  </div>

  <!-- Target Script Tag that gets executed and updated -->
  <script id="game-logic">
    /* Clean up any running instance */
    if (window.__cleanupGame) {
      try { window.__cleanupGame(); } catch (e) { console.warn(e); }
    }

    (function () {
      const container = document.getElementById('canvas-container');
      container.innerHTML = '';

      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || (window.innerHeight - 100);

      // Scene setup
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0c1017);
      scene.fog = new THREE.FogExp2(0x0c1017, 0.035);

      // Camera setup
      const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
      camera.position.set(-2, 7, 16);

      // Renderer setup
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      container.appendChild(renderer.domElement);

      // Orbit controls
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.02;
      controls.target.set(3.5, 1.8, -3.5);
      controls.update();

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(5, 8, 4);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 25;
      dirLight.shadow.bias = -0.0005;
      scene.add(dirLight);

      const fillLight = new THREE.DirectionalLight(0x6366f1, 0.4);
      fillLight.position.set(-5, 3, -3);
      scene.add(fillLight);

      // Flat Plane
      const planeGeo = new THREE.PlaneGeometry(30, 30);
      const planeMat = new THREE.MeshStandardMaterial({
        color: 0x141a24,
        roughness: 0.8,
        metalness: 0.1
      });
      const plane = new THREE.Mesh(planeGeo, planeMat);
      plane.rotation.x = -Math.PI / 2;
      plane.receiveShadow = true;
      scene.add(plane);

      // Grid helper on the plane
      const grid = new THREE.GridHelper(30, 30, 0x242d3d, 0x161c28);
      grid.position.y = 0.001;
      scene.add(grid);

      // Cube
      const cubeGeo = new THREE.BoxGeometry(1.4, 1.4, 1.4);
      const cubeMat = new THREE.MeshStandardMaterial({
        color: 0xef4444,
        roughness: 0.25,
        metalness: 0.2
      });
      const cube = new THREE.Mesh(cubeGeo, cubeMat);
      cube.position.y = 0.7;
      cube.castShadow = true;
      cube.receiveShadow = true;
      scene.add(cube);

      // Voxel Palm Tree
      const treeGroup = new THREE.Group();
      treeGroup.position.set(8.5, 0, -7.5);
      scene.add(treeGroup);

      const voxelBoxGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
      const palmMaterials = [
        new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.9, metalness: 0.1 }),
        new THREE.MeshStandardMaterial({ color: 0x92400e, roughness: 0.85, metalness: 0.1 }),
        new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.8, metalness: 0.1 }),
        new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.6 }),
        new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.55 }),
        new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.5 }),
        new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.8 })
      ];

      function addVoxel(parent, x, y, z, matIndex, scale = 1) {
        const mesh = new THREE.Mesh(voxelBoxGeo, palmMaterials[matIndex]);
        mesh.position.set(x, y, z);
        if (scale !== 1) mesh.scale.setScalar(scale);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      }

      // Trunk
      const trunkSteps = 12;
      let topX = 0, topZ = 0, topY = 0;
      for (let i = 0; i < trunkSteps; i++) {
        const progress = i / trunkSteps;
        const xOffset = -Math.pow(progress, 1.4) * 1.5;
        const zOffset = Math.sin(progress * Math.PI) * 0.6;
        const yPos = 0.25 + i * 0.45;
        const matIdx = i % 3;
        
        if (i === 0) {
          addVoxel(treeGroup, xOffset + 0.35, yPos, zOffset, 0, 0.9);
          addVoxel(treeGroup, xOffset - 0.35, yPos, zOffset, 1, 0.9);
          addVoxel(treeGroup, xOffset, yPos, zOffset + 0.35, 2, 0.9);
          addVoxel(treeGroup, xOffset, yPos, zOffset - 0.35, 0, 0.9);
        }
        
        addVoxel(treeGroup, xOffset, yPos, zOffset, matIdx, 1.05 - progress * 0.2);
        topX = xOffset;
        topY = yPos + 0.3;
        topZ = zOffset;
      }

      // Palm Crown Sub-group for wind sway
      const crownGroup = new THREE.Group();
      crownGroup.position.set(topX, topY, topZ);
      treeGroup.add(crownGroup);

      // Coconuts under the crown
      addVoxel(crownGroup, 0.28, -0.15, 0.15, 6, 0.7);
      addVoxel(crownGroup, -0.28, -0.12, 0.2, 6, 0.7);
      addVoxel(crownGroup, 0.0, -0.18, -0.3, 6, 0.75);

      // 6 Cascading Palm Fronds arching outward
      const frondCount = 6;
      for (let f = 0; f < frondCount; f++) {
        const angle = (f / frondCount) * Math.PI * 2 + (f % 2 === 0 ? 0.1 : -0.1);
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);

        const leafSegments = [
          { dist: 0.4, dy: 0.15, mat: 3, w: 0 },
          { dist: 0.85, dy: 0.32, mat: 4, w: 1 },
          { dist: 1.35, dy: 0.36, mat: 5, w: 1 },
          { dist: 1.85, dy: 0.22, mat: 4, w: 1 },
          { dist: 2.3, dy: -0.05, mat: 3, w: 0.5 },
          { dist: 2.7, dy: -0.45, mat: 4, w: 0 }
        ];

        leafSegments.forEach(seg => {
          const lx = cos * seg.dist;
          const lz = sin * seg.dist;
          addVoxel(crownGroup, lx, seg.dy, lz, seg.mat, 0.85);

          if (seg.w > 0) {
            const perpX = -sin * 0.35 * seg.w;
            const perpZ = cos * 0.35 * seg.w;
            addVoxel(crownGroup, lx + perpX, seg.dy - 0.08, lz + perpZ, (seg.mat === 5 ? 4 : 3), 0.65);
            addVoxel(crownGroup, lx - perpX, seg.dy - 0.08, lz - perpZ, (seg.mat === 5 ? 4 : 3), 0.65);
          }
        });
      }

      // Animation Loop
      let animId;
      const clock = new THREE.Clock();

      function animate() {
        animId = requestAnimationFrame(animate);
        const delta = clock.getDelta();
        const elapsed = clock.getElapsedTime();

        cube.rotation.y += delta * 0.5;
        cube.rotation.x += delta * 0.2;

        crownGroup.rotation.z = Math.sin(elapsed * 1.6) * 0.04;
        crownGroup.rotation.x = Math.cos(elapsed * 1.3) * 0.03;

        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      // Resize Handler
      function onResize() {
        const w = container.clientWidth;
        const h = container.clientHeight;
        if (!w || !h) return;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      window.addEventListener('resize', onResize);

      // Global Cleanup Handle
      window.__cleanupGame = function () {
        cancelAnimationFrame(animId);
        window.removeEventListener('resize', onResize);
        controls.dispose();
        cubeGeo.dispose();
        cubeMat.dispose();
        voxelBoxGeo.dispose();
        palmMaterials.forEach(mat => mat.dispose());
        planeGeo.dispose();
        planeMat.dispose();
        renderer.dispose();
      };
    })();
  </script>

  <script>
    /* Two-Phase AI Generation Engine & Version Control */

    // System prompt for Phase 1: Architectural Reasoning & Planning
    const REASONING_SYSTEM_PROMPT = `You are an elite 3D WebGL and Three.js engine architect.
Your job is to analyze the user's requested modification to the existing Three.js game code and produce a rigorous, structured internal thinking and architectural plan.

In your thinking block:
1. Deconstruct the user's request into precise technical requirements.
2. Formulate the architectural changes:
   - Identify which Three.js geometries, materials, meshes, lights, or physics variables are needed.
   - Outline the mathematical logic, event listeners, or animation loop updates.
   - Plan proper disposal in window.__cleanupGame to avoid WebGL memory leaks.
3. Formulate step-by-step implementation instructions.

Output ONLY your analytical thinking and architectural plan. Do not output raw runnable code fences in this phase.`;

    // System prompt for Phase 2: Code Synthesis using the Thinking Block Context
    const CODE_SYSTEM_PROMPT = `You are an expert Three.js and WebGL game engine programmer.
Your task is to produce the final, complete JavaScript Three.js game code using the provided architectural reasoning plan.

Rules:
1. Return ONLY pure, runnable JavaScript code. Do not include markdown fences (no \`\`\`javascript or \`\`\`), commentary, or conversational filler.
2. The code will execute in a live browser context with THREE and OrbitControls globally available.
3. Always implement proper teardown: define \`window.__cleanupGame = function() { ... }\` that cancels active \`requestAnimationFrame\`, removes all window event listeners (keydown, resize, etc.), and disposes of materials/geometries.
4. Target '#canvas-container'. Always size renderer and camera aspect using container.clientWidth and container.clientHeight.
5. Strictly adhere to the plan laid out in the architectural thinking block.`;

    const versionStore = {
      commits: [],
      currentHeadIndex: 0
    };

    function generateCommitHash() {
      return Math.random().toString(36).substring(2, 9);
    }

    function formatRelativeTime(date) {
      const seconds = Math.floor((new Date() - date) / 1000);
      if (seconds < 15) return 'Just now';
      if (seconds < 60) return `${seconds}s ago`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      return date.toLocaleDateString();
    }

    const input = document.getElementById('prompt-input');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const statusDot = document.getElementById('status-indicator');
    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const toast = document.getElementById('toast');

    const versionCountBadge = document.getElementById('version-count-badge');
    const quickUndoBtn = document.getElementById('quick-undo-btn');
    const quickRedoBtn = document.getElementById('quick-redo-btn');

    const historyDrawer = document.getElementById('history-drawer');
    const historyBackdrop = document.getElementById('history-backdrop');
    const toggleHistoryBtn = document.getElementById('toggle-history-btn');
    const closeHistoryBtn = document.getElementById('close-history-btn');
    const timelineList = document.getElementById('timeline-list');
    const historySummary = document.getElementById('history-summary');
    const exportHistoryBtn = document.getElementById('export-history-btn');
    const exportStandaloneBtn = document.getElementById('export-standalone-btn');

    const codeModal = document.getElementById('code-modal');
    const modalCodeTitle = document.getElementById('modal-code-title');
    const modalCodeContent = document.getElementById('modal-code-content');
    const modalReasoningContent = document.getElementById('modal-reasoning-content');
    const tabCodeBtn = document.getElementById('tab-code-btn');
    const tabReasoningBtn = document.getElementById('tab-reasoning-btn');
    const copyCodeBtn = document.getElementById('copy-code-btn');
    const closeCodeModalBtn = document.getElementById('close-code-modal-btn');

    let viewedCodeString = '';
    let viewedReasoningString = '';
    let currentModalTab = 'code';

    function showToast(msg, isError = false) {
      toast.textContent = msg;
      toast.className = `fixed top-4 left-1/2 -translate-x-1/2 px-3.5 py-1.5 rounded-xl text-xs backdrop-blur-md transition-all duration-200 pointer-events-none z-50 opacity-100 shadow-xl border ${
        isError
          ? 'bg-rose-950/90 text-rose-200 border-rose-500/30 shadow-rose-950/40'
          : 'bg-slate-900/95 text-slate-200 border-slate-700/80 shadow-slate-950/50'
      }`;
      setTimeout(() => {
        toast.classList.replace('opacity-100', 'opacity-0');
      }, 2600);
    }

    function extractExecutableCode(rawText) {
      if (!rawText) return '';
      const blockMatch = rawText.match(/```(?:javascript|js)?\s*([\s\S]*?)```/i);
      if (blockMatch && blockMatch[1]) {
        return blockMatch[1].trim();
      }
      return rawText.replace(/^```(?:javascript|js)?\n?/i, '').replace(/\n?```$/i, '').trim();
    }

    function testSyntax(code) {
      try {
        new Function(code);
        return null;
      } catch (err) {
        return err;
      }
    }

    function executeEngineCode(code) {
      if (typeof window.__cleanupGame === 'function') {
        try {
          window.__cleanupGame();
        } catch (e) {
          console.warn("Teardown warning:", e);
        }
      }

      const container = document.getElementById('canvas-container');
      if (container) {
        container.innerHTML = '';
      }

      const currentScriptElem = document.getElementById('game-logic');
      if (currentScriptElem) {
        currentScriptElem.remove();
      }

      const newScript = document.createElement('script');
      newScript.id = 'game-logic';
      newScript.textContent = code;
      document.body.appendChild(newScript);
    }

    function recordCommit(code, message, type = 'prompt', thinking = '') {
      const commitNumber = versionStore.commits.length + 1;
      const newCommit = {
        id: `v${commitNumber}`,
        hash: generateCommitHash(),
        versionNumber: commitNumber,
        timestamp: new Date(),
        message: message.trim() || `Snapshot #${commitNumber}`,
        code: code,
        thinking: thinking,
        type: type
      };

      versionStore.commits.push(newCommit);
      versionStore.currentHeadIndex = versionStore.commits.length - 1;
      updateUI();
      return newCommit;
    }

    function checkoutCommit(index, notify = true) {
      if (index < 0 || index >= versionStore.commits.length) return;

      versionStore.currentHeadIndex = index;
      const targetCommit = versionStore.commits[index];

      try {
        executeEngineCode(targetCommit.code);
        if (notify) {
          showToast(`Checked out ${targetCommit.id} (${targetCommit.hash})`);
        }
      } catch (err) {
        console.error("Execution error on checkout:", err);
        showToast("Error executing version code", true);
      }

      updateUI();
    }

    function updateUI() {
      const current = versionStore.commits[versionStore.currentHeadIndex];
      const total = versionStore.commits.length;

      if (!current) return;

      versionCountBadge.textContent = total;
      historySummary.textContent = `${total} version${total === 1 ? '' : 's'} recorded`;

      quickUndoBtn.disabled = versionStore.currentHeadIndex <= 0;
      quickRedoBtn.disabled = versionStore.currentHeadIndex >= total - 1;

      renderHistoryList();
    }

    function renderHistoryList() {
      timelineList.innerHTML = '';

      for (let i = versionStore.commits.length - 1; i >= 0; i--) {
        const commit = versionStore.commits[i];
        const isHead = (i === versionStore.currentHeadIndex);

        const item = document.createElement('div');
        item.className = `relative pl-5 pb-3 border-l-2 transition-colors ${
          isHead ? 'border-indigo-500' : 'border-slate-800'
        }`;

        let typeBadgeClass = 'bg-slate-800/80 border-slate-700 text-slate-300';
        let typeIcon = '<i class="fa-solid fa-wand-magic-sparkles text-[9px]"></i>';
        
        if (commit.type === 'init') {
          typeBadgeClass = 'bg-slate-800/80 border-slate-700 text-slate-300';
          typeIcon = '<i class="fa-solid fa-cube text-[9px]"></i>';
        } else if (commit.type === 'revert') {
          typeBadgeClass = 'bg-slate-800/80 border-slate-700 text-slate-300';
          typeIcon = '<i class="fa-solid fa-arrow-rotate-left text-[9px]"></i>';
        }

        const nodeColor = isHead ? 'bg-indigo-500 ring-4 ring-indigo-500/20' : 'bg-slate-700';

        item.innerHTML = `
          <div class="absolute -left-[9px] top-1.5 w-4 h-4 rounded-full ${nodeColor} flex items-center justify-center transition-all">
            ${isHead ? '<div class="w-1.5 h-1.5 rounded-full bg-slate-950"></div>' : ''}
          </div>

          <div class="bg-[#121622] hover:bg-[#151a28] border ${
            isHead ? 'border-indigo-500/50 shadow-md shadow-indigo-950/20' : 'border-slate-800'
          } rounded-xl p-3 transition">
            
            <div class="flex items-center justify-between gap-2 mb-1.5">
              <div class="flex items-center gap-1.5">
                <span class="text-xs font-mono font-semibold ${isHead ? 'text-indigo-400' : 'text-slate-200'}">${commit.id}</span>
                <span class="text-[10px] font-mono text-slate-400 bg-slate-900 px-1.5 py-0.5 rounded border border-slate-800">${commit.hash}</span>
                <span class="inline-flex items-center gap-1 text-[9px] font-medium uppercase tracking-wider px-1.5 py-0.5 rounded border ${typeBadgeClass}">
                  ${typeIcon}
                  <span>${commit.type || 'prompt'}</span>
                </span>
                ${isHead ? '<span class="text-[9px] font-semibold uppercase tracking-wider bg-indigo-600 text-white px-1.5 py-0.5 rounded font-mono shadow-sm">ACTIVE</span>' : ''}
              </div>
              <span class="text-[10px] text-slate-400 font-mono">${formatRelativeTime(commit.timestamp)}</span>
            </div>

            <p class="text-xs text-slate-200 font-medium mb-3 break-words line-clamp-2">${commit.message}</p>

            <div class="flex items-center justify-between pt-2 border-t border-slate-800/80">
              <div class="flex items-center gap-1.5">
                <button 
                  data-view-index="${i}"
                  class="view-code-btn h-6 px-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white text-[11px] font-medium transition flex items-center gap-1 border border-slate-800 hover:border-slate-700"
                >
                  <i class="fa-solid fa-code text-[10px] text-slate-400"></i> Code & Plan
                </button>
              </div>

              ${!isHead ? `
                <button 
                  data-checkout-index="${i}"
                  class="checkout-btn h-6 px-2.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-200 hover:text-white border border-slate-800 hover:border-slate-700 font-medium text-[11px] transition flex items-center gap-1 shadow-sm active:scale-95"
                >
                  <i class="fa-solid fa-rotate-left text-[10px] text-slate-400"></i> Revert
                </button>
              ` : `
                <span class="text-[10px] font-medium text-emerald-400 flex items-center gap-1 px-2 py-0.5 rounded-lg bg-emerald-500/10 border border-emerald-500/25">
                  <i class="fa-solid fa-check text-[9px]"></i> Current
                </span>
              `}
            </div>
          </div>
        `;

        timelineList.appendChild(item);
      }

      timelineList.querySelectorAll('.checkout-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-checkout-index'), 10);
          checkoutCommit(idx);
        });
      });

      timelineList.querySelectorAll('.view-code-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-view-index'), 10);
          openCodeModal(idx);
        });
      });
    }

    function openHistoryDrawer() {
      historyDrawer.classList.remove('translate-x-full');
      historyBackdrop.classList.remove('opacity-0', 'pointer-events-none');
      renderHistoryList();
    }

    function closeHistoryDrawer() {
      historyDrawer.classList.add('translate-x-full');
      historyBackdrop.classList.add('opacity-0', 'pointer-events-none');
    }

    function switchModalTab(tab) {
      currentModalTab = tab;
      if (tab === 'code') {
        tabCodeBtn.className = "px-2.5 py-1 rounded bg-indigo-600 text-white font-medium transition";
        tabReasoningBtn.className = "px-2.5 py-1 rounded text-slate-400 hover:text-slate-200 font-medium transition";
        modalCodeContent.classList.remove('hidden');
        modalReasoningContent.classList.add('hidden');
      } else {
        tabReasoningBtn.className = "px-2.5 py-1 rounded bg-indigo-600 text-white font-medium transition";
        tabCodeBtn.className = "px-2.5 py-1 rounded text-slate-400 hover:text-slate-200 font-medium transition";
        modalReasoningContent.classList.remove('hidden');
        modalCodeContent.classList.add('hidden');
      }
    }

    function openCodeModal(index) {
      const commit = versionStore.commits[index];
      if (!commit) return;

      modalCodeTitle.textContent = `${commit.id} (${commit.hash}) - ${commit.message}`;
      viewedCodeString = commit.code;
      viewedReasoningString = commit.thinking || "No reasoning plan logged for this snapshot (initial or direct checkout).";
      
      modalCodeContent.textContent = viewedCodeString;
      modalReasoningContent.textContent = viewedReasoningString;

      switchModalTab('code');
      codeModal.classList.remove('opacity-0', 'pointer-events-none');
    }

    function closeCodeModal() {
      codeModal.classList.add('opacity-0', 'pointer-events-none');
    }

    tabCodeBtn.addEventListener('click', () => switchModalTab('code'));
    tabReasoningBtn.addEventListener('click', () => switchModalTab('reasoning'));

    function setEngineStage(stage, label) {
      if (stage === 'reasoning') {
        submitBtn.disabled = true;
        input.disabled = true;
        btnText.textContent = "Reasoning...";
        btnSpinner.classList.remove('hidden');
        statusDot.className = "w-1.5 h-1.5 rounded-full bg-violet-400 animate-ping";
        statusBadge.className = "flex items-center gap-1.5 h-7 px-2.5 rounded-lg bg-violet-500/10 border border-violet-500/25 text-violet-300 text-[10px] font-mono font-medium shrink-0";
        statusText.textContent = label || "Thinking";
      } else if (stage === 'coding') {
        submitBtn.disabled = true;
        input.disabled = true;
        btnText.textContent = "Synthesizing...";
        btnSpinner.classList.remove('hidden');
        statusDot.className = "w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse";
        statusBadge.className = "flex items-center gap-1.5 h-7 px-2.5 rounded-lg bg-amber-500/10 border border-amber-500/25 text-amber-300 text-[10px] font-mono font-medium shrink-0";
        statusText.textContent = label || "Writing Code";
      } else if (stage === 'ready') {
        submitBtn.disabled = false;
        input.disabled = false;
        btnText.textContent = "Apply";
        btnSpinner.classList.add('hidden');
        statusDot.className = "w-1.5 h-1.5 rounded-full bg-emerald-400";
        statusBadge.className = "flex items-center gap-1.5 h-7 px-2.5 rounded-lg bg-emerald-500/10 border border-emerald-500/25 text-emerald-300 text-[10px] font-mono font-medium shrink-0";
        statusText.textContent = "Ready";
      } else if (stage === 'error') {
        submitBtn.disabled = false;
        input.disabled = false;
        btnText.textContent = "Apply";
        btnSpinner.classList.add('hidden');
        statusDot.className = "w-1.5 h-1.5 rounded-full bg-rose-500";
        statusBadge.className = "flex items-center gap-1.5 h-7 px-2.5 rounded-lg bg-rose-500/10 border border-rose-500/25 text-rose-300 text-[10px] font-mono font-medium shrink-0";
        statusText.textContent = "Error";
      }
    }

    async function callGemini(payload, maxRetries = 3, initialDelay = 1000) {
      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      let delay = initialDelay;

      for (let attempt = 0; attempt < maxRetries; attempt++) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            const errJson = await response.json().catch(() => ({}));
            throw new Error(errJson.error?.message || `API error: ${response.status} ${response.statusText}`);
          }

          return await response.json();
        } catch (error) {
          if (attempt === maxRetries - 1) throw error;
          await new Promise(resolve => setTimeout(resolve, delay));
          delay *= 2;
        }
      }
    }

    /* Two-Phase Execution Pipeline: Hidden Reasoning -> Synthesis with Reasoning Context */
    async function applyUserPrompt(promptText) {
      if (!promptText.trim()) return;

      const activeCommit = versionStore.commits[versionStore.currentHeadIndex];
      const currentCode = activeCommit ? activeCommit.code : (document.getElementById('game-logic')?.textContent || '');

      try {
        // ==========================================
        // PHASE 1: Hidden Architectural Reasoning
        // ==========================================
        setEngineStage('reasoning', 'Reasoning');

        const reasoningPrompt = `Current Three.js engine code:\n\`\`\`javascript\n${currentCode}\n\`\`\`\n\nUser's requested modification:\n"${promptText}"\n\nProduce your architectural thinking block and implementation strategy.`;

        const reasoningPayload = {
          contents: [{ parts: [{ text: reasoningPrompt }] }],
          systemInstruction: {
            parts: [{ text: REASONING_SYSTEM_PROMPT }]
          }
        };

        const reasoningData = await callGemini(reasoningPayload);
        const thinkingBlock = reasoningData.candidates?.[0]?.content?.parts?.[0]?.text;

        if (!thinkingBlock) {
          throw new Error("Reasoning phase failed to generate a plan.");
        }

        // ==========================================
        // PHASE 2: Code Synthesis with Thinking Context
        // ==========================================
        setEngineStage('coding', 'Writing Code');

        const synthesisPrompt = `Current Three.js engine code:\n\`\`\`javascript\n${currentCode}\n\`\`\`\n\nUser Request:\n"${promptText}"\n\n[ARCHITECTURAL REASONING & EXECUTION PLAN]:\n${thinkingBlock}\n\nExecute the above architectural plan and return the complete updated runnable JavaScript code including window.__cleanupGame.`;

        const codePayload = {
          contents: [{ parts: [{ text: synthesisPrompt }] }],
          systemInstruction: {
            parts: [{ text: CODE_SYSTEM_PROMPT }]
          }
        };

        const codeData = await callGemini(codePayload);
        const rawCode = codeData.candidates?.[0]?.content?.parts?.[0]?.text;

        if (!rawCode) {
          throw new Error("Synthesis phase failed to return runnable code.");
        }

        const generatedCode = extractExecutableCode(rawCode);

        // Pre-validate syntax
        const syntaxErr = testSyntax(generatedCode);
        if (syntaxErr) {
          throw new Error(`Generated code syntax error: ${syntaxErr.message}`);
        }

        // Apply and commit
        executeEngineCode(generatedCode);
        recordCommit(generatedCode, promptText, 'prompt', thinkingBlock);

        input.value = '';
        showToast("Engine updated via reasoned plan");
        setEngineStage('ready');
      } catch (err) {
        console.error("Engine pipeline failed:", err);
        showToast(err.message || "Failed to update scene", true);
        setEngineStage('error');
      }
    }

    submitBtn.addEventListener('click', () => applyUserPrompt(input.value));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        applyUserPrompt(input.value);
      }
    });

    toggleHistoryBtn.addEventListener('click', openHistoryDrawer);
    closeHistoryBtn.addEventListener('click', closeHistoryDrawer);
    historyBackdrop.addEventListener('click', closeHistoryDrawer);

    quickUndoBtn.addEventListener('click', () => {
      if (versionStore.currentHeadIndex > 0) {
        checkoutCommit(versionStore.currentHeadIndex - 1);
      }
    });

    quickRedoBtn.addEventListener('click', () => {
      if (versionStore.currentHeadIndex < versionStore.commits.length - 1) {
        checkoutCommit(versionStore.currentHeadIndex + 1);
      }
    });

    closeCodeModalBtn.addEventListener('click', closeCodeModal);
    codeModal.addEventListener('click', (e) => {
      if (e.target === codeModal) closeCodeModal();
    });

    copyCodeBtn.addEventListener('click', () => {
      const textToCopy = currentModalTab === 'code' ? viewedCodeString : viewedReasoningString;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy)
          .then(() => showToast(currentModalTab === 'code' ? "Code copied" : "Reasoning copied"))
          .catch(() => {
            document.execCommand('copy');
            showToast("Copied to clipboard");
          });
      } else {
        document.execCommand('copy');
        showToast("Copied to clipboard");
      }
    });

    exportHistoryBtn.addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(versionStore.commits, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `threejs-engine-history-${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast("History exported as JSON");
    });

    exportStandaloneBtn.addEventListener('click', () => {
      const activeCommit = versionStore.commits[versionStore.currentHeadIndex];
      const gameCode = activeCommit ? activeCommit.code : (document.getElementById('game-logic')?.textContent || '');

      const standaloneHtml = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js Game</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d13;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <script>
${gameCode}
  <\/script>
</body>
</html>`;

      const blob = new Blob([standaloneHtml], { type: 'text/html;charset=utf-8' });
      const blobUrl = URL.createObjectURL(blob);
      const downloadAnchor = document.createElement('a');
      downloadAnchor.href = blobUrl;
      const fileId = activeCommit ? activeCommit.id : 'v1';
      downloadAnchor.download = `threejs-game-${fileId}.html`;
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      URL.revokeObjectURL(blobUrl);
      showToast("Game exported as .html");
    });

    window.addEventListener('keydown', (e) => {
      if (document.activeElement === input) return;

      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) {
          if (versionStore.currentHeadIndex < versionStore.commits.length - 1) {
            checkoutCommit(versionStore.currentHeadIndex + 1);
          }
        } else {
          if (versionStore.currentHeadIndex > 0) {
            checkoutCommit(versionStore.currentHeadIndex - 1);
          }
        }
      } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') {
        e.preventDefault();
        if (versionStore.currentHeadIndex < versionStore.commits.length - 1) {
          checkoutCommit(versionStore.currentHeadIndex + 1);
        }
      } else if (e.key === 'Escape') {
        closeHistoryDrawer();
        closeCodeModal();
      }
    });

    function updateAppHeight() {
      const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty('--app-height', `${h}px`);
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateAppHeight);
      window.visualViewport.addEventListener('scroll', updateAppHeight);
    }
    window.addEventListener('resize', updateAppHeight);
    window.addEventListener('orientationchange', () => {
      setTimeout(updateAppHeight, 150);
    });
    updateAppHeight();

    window.addEventListener('load', () => {
      updateAppHeight();
      const initialScript = document.getElementById('game-logic');
      const initialCode = initialScript ? initialScript.textContent : '';
      recordCommit(initialCode, "Initial Scene (Red Cube & Voxel Palm Tree)", "init", "Initial base scene setup.");
    });
  </script>
</body>

</html>
